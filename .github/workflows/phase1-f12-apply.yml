name: Phase 1 F12 apply
on:
  push:
    branches: [phase1-hardening]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[f12-apply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Add Excel dependency
        run: npm install exceljs@4.4.0 --save --save-exact
      - name: Add workbook exporter, UI wiring and F12 regression
        shell: bash
        run: |
          cat > src/lib/institutionExcelExport.ts <<'EOF'
          import type { AnalyticsTaxonomyRow, AnalyticsV12Payload } from '@/types/analytics-v12';
          import type { InstitutionClassRow, InstitutionStudentRow } from '@/types/institution-analytics';

          type WorkbookInput = {
            schoolName: string;
            classRow: InstitutionClassRow;
            students: InstitutionStudentRow[];
            analytics: AnalyticsV12Payload[];
          };

          const MIME = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

          function safeFilePart(value: string) {
            return value.replace(/[^a-z0-9-_]+/gi, '-').replace(/^-+|-+$/g, '').slice(0, 80) || 'evidara';
          }

          function styleSheet(sheet: import('exceljs').Worksheet) {
            const header = sheet.getRow(1);
            header.font = { bold: true };
            header.alignment = { vertical: 'middle' };
            sheet.views = [{ state: 'frozen', ySplit: 1 }];
            if (sheet.columnCount > 0) sheet.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: sheet.columnCount } };
            for (const column of sheet.columns) {
              let width = Math.max(12, String(column.header || '').length + 2);
              column.eachCell?.({ includeEmpty: false }, (cell) => { width = Math.min(42, Math.max(width, String(cell.value ?? '').length + 2)); });
              column.width = width;
            }
          }

          function taxonomyRows(payload: AnalyticsV12Payload, rows: AnalyticsTaxonomyRow[], level: 'Subject' | 'Chapter' | 'Topic') {
            return rows.map((row) => ({
              Student: payload.student.full_name,
              'Student ID': payload.student.id,
              Grade: payload.student.grade,
              Section: payload.student.section_name,
              Level: level,
              Name: row.name,
              Parent: row.parent_name || '',
              Exposure: row.questions,
              Attempted: row.correct + row.incorrect,
              Correct: row.correct,
              Incorrect: row.incorrect,
              Unanswered: row.unanswered,
              'Accuracy %': row.correct + row.incorrect > 0 ? row.accuracy : null,
              'Score %': row.questions > 0 ? row.average_percentage ?? null : null,
              'Avg Time (sec)': row.average_seconds,
              'Trend Δ': row.trend_delta,
              'Evidence Count': row.attempts,
            }));
          }

          function addObjectSheet(workbook: import('exceljs').Workbook, name: string, rows: Array<Record<string, string | number | null | undefined>>) {
            const sheet = workbook.addWorksheet(name);
            const headers = rows.length ? Object.keys(rows[0]) : ['No evidence'];
            sheet.columns = headers.map((header) => ({ header, key: header }));
            if (rows.length) sheet.addRows(rows);
            styleSheet(sheet);
            return sheet;
          }

          export async function exportInstitutionAnalyticsWorkbook(input: WorkbookInput) {
            const ExcelJS = await import('exceljs');
            const workbook = new ExcelJS.Workbook();
            workbook.creator = 'Evidara';
            workbook.created = new Date();
            workbook.modified = new Date();
            workbook.properties.date1904 = false;

            addObjectSheet(workbook, 'Results', input.students.map((row) => ({
              Rank: row.rank,
              Student: row.name,
              'Student ID': row.id,
              Grade: row.grade,
              Section: row.sectionName,
              'Academic Year': row.academicYear,
              'Tests Taken': row.completedTests,
              'Average %': row.averagePercentage,
              'Accuracy %': row.accuracy,
              'Highest %': row.highestPercentage,
              'Lowest %': row.lowestPercentage,
              'Last Test': row.lastTestAt,
            })));

            addObjectSheet(workbook, 'Test Results', input.analytics.flatMap((payload) => payload.history.map((row) => ({
              Student: payload.student.full_name,
              'Student ID': payload.student.id,
              Test: row.paper_title,
              'Test ID': row.paper_id,
              Submitted: row.submitted_at,
              Score: row.score,
              'Maximum Marks': row.maximum_marks,
              'Percentage %': row.percentage,
              'Accuracy %': row.accuracy,
              'Duration (min)': row.duration_minutes,
              Correct: row.correct,
              Incorrect: row.incorrect,
              Unanswered: row.unanswered,
              'Result Mode': row.result_mode,
            }))));

            addObjectSheet(workbook, 'Subject Analytics', input.analytics.flatMap((payload) => taxonomyRows(payload, payload.subjects, 'Subject')));
            addObjectSheet(workbook, 'Chapter Analytics', input.analytics.flatMap((payload) => taxonomyRows(payload, payload.chapters, 'Chapter')));
            addObjectSheet(workbook, 'Topic Analytics', input.analytics.flatMap((payload) => taxonomyRows(payload, payload.topics, 'Topic')));

            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer as BlobPart], { type: MIME });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = `${safeFilePart(input.schoolName)}-${safeFilePart(input.classRow.name)}-analytics.xlsx`;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            URL.revokeObjectURL(url);
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/institution-analytics/institution-analytics-workspace.tsx')
          text = path.read_text()
          replacements = [
            (
              "import { useAppStore } from '@/store/use-app-store';",
              "import { useAppStore } from '@/store/use-app-store';\nimport { exportInstitutionAnalyticsWorkbook } from '@/lib/institutionExcelExport';\nimport type { AnalyticsV12Payload } from '@/types/analytics-v12';"
            ),
            (
              "  const [bulkDownloading, setBulkDownloading] = useState<'pdf' | 'csv' | null>(null);",
              "  const [bulkDownloading, setBulkDownloading] = useState<'pdf' | 'csv' | null>(null);\n  const [excelDownloading, setExcelDownloading] = useState(false);"
            ),
            (
              "  async function downloadSchoolResults(kind: 'pdf' | 'csv') {",
              "  async function downloadExcel() {\n    const chosen = selectedStudents.size ? (payload.students || []).filter((row) => selectedStudents.has(row.id)) : students;\n    if (!chosen.length || !(payload.section || payload.class) || excelDownloading) return;\n    if (!supabase) { setError('Supabase is not configured on this device.'); return; }\n    setExcelDownloading(true);\n    setError('');\n    try {\n      const analytics: AnalyticsV12Payload[] = [];\n      const batchSize = 5;\n      for (let offset = 0; offset < chosen.length; offset += batchSize) {\n        const batch = chosen.slice(offset, offset + batchSize);\n        const results = await Promise.all(batch.map(async (student) => {\n          const { data, error: analyticsError } = await supabase.rpc('get_student_analytics_v12', {\n            p_student_id: student.id,\n            p_product_id: null,\n            p_date_from: null,\n            p_date_to: null,\n          });\n          if (analyticsError) throw new Error(`${student.name}: ${analyticsError.message}`);\n          return data as AnalyticsV12Payload;\n        }));\n        analytics.push(...results);\n      }\n      await exportInstitutionAnalyticsWorkbook({\n        schoolName: payload.school?.name || 'Evidara School',\n        classRow: (payload.section || payload.class)!,\n        students: chosen,\n        analytics,\n      });\n    } catch (value) {\n      setError(value instanceof Error ? value.message : 'Unable to create the Excel analytics workbook.');\n    } finally {\n      setExcelDownloading(false);\n    }\n  }\n\n  async function downloadSchoolResults(kind: 'pdf' | 'csv') {"
            ),
            (
              "onDownloadReports={downloadReportCards} onDownloadCsv={downloadCsv} />}",
              "onDownloadReports={downloadReportCards} onDownloadCsv={downloadCsv} onDownloadExcel={downloadExcel} excelDownloading={excelDownloading} />}"
            ),
            (
              "onDownloadReports: () => void; onDownloadCsv: () => void }) {",
              "onDownloadReports: () => void; onDownloadCsv: () => void; onDownloadExcel: () => void; excelDownloading: boolean }) {"
            ),
            (
              "onDownloadReports, onDownloadCsv } = props;",
              "onDownloadReports, onDownloadCsv, onDownloadExcel, excelDownloading } = props;"
            ),
            (
              "<div><Button variant=\"outline\" onClick={onDownloadCsv} disabled={!students.length}><FileDown />Download CSV</Button><Button onClick={onDownloadReports} disabled={!selected.size}><Download />Report cards ({selected.size})</Button></div>",
              "<div><Button variant=\"outline\" onClick={onDownloadExcel} disabled={!students.length || excelDownloading}>{excelDownloading ? <LoaderCircle className=\"institution-button-spinner\" /> : <FileDown />}Download Excel</Button><Button variant=\"outline\" onClick={onDownloadCsv} disabled={!students.length}><FileDown />Download CSV</Button><Button onClick={onDownloadReports} disabled={!selected.size}><Download />Report cards ({selected.size})</Button></div>"
            ),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'F12 patch anchor missing: {old[:120]}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cat > scripts/f12-excel-export-smoke.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.cwd();
          const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');
          const pkg = JSON.parse(read('package.json'));
          const exporter = read('src/lib/institutionExcelExport.ts');
          const workspace = read('src/components/institution-analytics/institution-analytics-workspace.tsx');
          const failures = [];
          let passed = 0;
          const check = (label, condition) => { if (condition) { passed += 1; console.log(`✓ ${label}`); } else { failures.push(label); console.error(`✗ ${label}`); } };
          check('ExcelJS is a pinned production dependency', pkg.dependencies?.exceljs === '4.4.0');
          check('exporter creates a true XLSX workbook', /workbook\.xlsx\.writeBuffer\(\)/.test(exporter) && /application\/vnd\.openxmlformats-officedocument\.spreadsheetml\.sheet/.test(exporter));
          check('download uses .xlsx extension', /analytics\.xlsx/.test(exporter));
          check('results worksheet is present', /'Results'/.test(exporter));
          check('test-results worksheet is present', /'Test Results'/.test(exporter));
          check('subject worksheet is present', /'Subject Analytics'/.test(exporter));
          check('chapter worksheet is present', /'Chapter Analytics'/.test(exporter));
          check('topic worksheet is present', /'Topic Analytics'/.test(exporter));
          check('taxonomy export keeps exposure/attempted/outcome evidence', /Exposure:[\s\S]*?Attempted:[\s\S]*?Correct:[\s\S]*?Incorrect:[\s\S]*?Unanswered:/.test(exporter));
          check('taxonomy export includes accuracy, score, time, trend and evidence count', /'Accuracy %'[\s\S]*?'Score %'[\s\S]*?'Avg Time \(sec\)'[\s\S]*?'Trend Δ'[\s\S]*?'Evidence Count'/.test(exporter));
          check('workspace fetches authorized student analytics for workbook rows', /supabase\.rpc\('get_student_analytics_v12'/.test(workspace) && /batchSize = 5/.test(workspace));
          check('workspace exposes an explicit Download Excel action', /Download Excel/.test(workspace) && /onDownloadExcel=\{downloadExcel\}/.test(workspace));
          check('Excel export does not masquerade as CSV', !/analytics\.csv/.test(exporter));
          if (failures.length) { console.error(`\nF12 Excel export smoke failed: ${failures.length} failed, ${passed} passed.`); process.exit(1); }
          console.log(`\nF12 Excel export checks passed (${passed} checks).`);
          EOF

          node scripts/f12-excel-export-smoke.mjs
          npm run typecheck -- --incremental false
      - name: Commit F12 implementation
        shell: bash
        run: |
          git config user.name 'Evidara Phase 1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json src/lib/institutionExcelExport.ts src/components/institution-analytics/institution-analytics-workspace.tsx scripts/f12-excel-export-smoke.mjs
          git commit -m 'feat(f12): add real Excel analytics workbook [f12-apply]'
          git push

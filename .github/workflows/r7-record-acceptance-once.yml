name: R7 Record Acceptance Once

on:
  push:
    branches: [phase1-hardening]
    paths:
      - .github/workflows/r7-record-acceptance-once.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Record R7 evidence and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('PHASE1_RELEASE_CHECKLIST.md')
          text = p.read_text()
          old = '- [ ] R7 Approve questions.'
          new = '- [x] R7 Approve questions — verified 2 Sep 2026 in the isolated synthetic `Evidara School` tenant. Acceptance first exposed a real authorization mismatch: current `school_admin` members could import questions but `can_review_org_question()` only recognized legacy institute-admin/reviewer roles. Migration `20260902232500_phase1_r7_school_admin_question_review.sql` adds active `school_admin` review parity while keeping anon blocked. The 500 imported synthetic questions were tagged to the tenant Physics/Kinematics/Motion taxonomy required by the analytics-ready approval guard, then canonical `bulk_review_questions_v13` approved all 500 as an authenticated acceptance School Admin; verification found 500/500 `approved`, 500 `approved_at` timestamps and 500 approval review rows. Exact fix commit `fa945496b97db02bb7d18acc7efcde1f5d975b86` passed complete release gate `33663448733`.'
          if old not in text:
              raise SystemExit('R7 unchecked line not found')
          p.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/r7-record-acceptance-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE1_RELEASE_CHECKLIST.md .github/workflows/r7-record-acceptance-once.yml
          git commit -m 'docs(r7): record verified question approval acceptance'
          git push origin HEAD:phase1-hardening

name: Evidara D7 Paper Actions Patch

on:
  push:
    branches: [phase1-hardening]
    paths:
      - scripts/apply-d7-paper-actions-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply D7 paper actions patch
        run: node scripts/apply-d7-paper-actions-patch.mjs
      - name: Commit D7 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/evidara/live-paper-catalogue-v8.tsx scripts/d7-paper-card-actions-smoke.mjs .github/workflows/phase1-release-gate.yml
          if git diff --cached --quiet; then
            echo "D7 patch already applied."
          else
            git commit -m "Implement real D7 paper card actions"
            git push origin HEAD:phase1-hardening
          fi

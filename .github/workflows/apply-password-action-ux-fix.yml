name: Apply password action UX fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-password-action-ux-fix.py'
      - '.github/workflows/apply-password-action-ux-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply password UX patch
        run: python3 scripts/apply-password-action-ux-fix.py

      - name: Verify diff formatting
        run: git diff --check

      - name: Typecheck
        run: npm run typecheck -- --incremental false

      - name: Commit verified source changes
        shell: bash
        run: |
          if git diff --quiet -- src/components/evidara/credential-security-gate.tsx src/components/school/StudentLifecycleManager.tsx src/components/evidara/access-control-view.tsx src/components/evidara/admin-demo-student-accounts.tsx; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/evidara/credential-security-gate.tsx src/components/school/StudentLifecycleManager.tsx src/components/evidara/access-control-view.tsx src/components/evidara/admin-demo-student-accounts.tsx
          git commit -m "Fix password actions across user roles"
          git push origin HEAD:main

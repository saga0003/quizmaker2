name: D5 Clone Patch

on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/d5-clone-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Apply guarded D5 patch
        run: python scripts/d5_clone_patch.py
      - name: Commit component patch
        run: |
          git config user.name "Evidara Phase 1 Hardening"
          git config user.email "sagar@smis.edu.in"
          git add src/components/evidara/live-paper-catalogue-v8.tsx
          git commit -m "feat(d5): expose clone-as-new-version action"
          git push origin HEAD:phase1-hardening

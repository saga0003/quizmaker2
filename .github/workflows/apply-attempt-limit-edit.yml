name: Apply attempt-limit edit patch

on:
  push:
    branches:
      - fix/edit-attempt-limit-after-attempts-2026-09-23
    paths:
      - scripts/apply-attempt-limit-edit.py
      - .github/workflows/apply-attempt-limit-edit.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/edit-attempt-limit-after-attempts-2026-09-23
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python scripts/apply-attempt-limit-edit.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Verify attempt-limit guardrails
        run: |
          grep -q "update_question_paper_attempt_limit_v1" src/components/evidara/live-paper-catalogue-v8.tsx
          grep -q "Existing student attempts, scores and analytics were not changed" src/components/evidara/live-paper-catalogue-v8.tsx
          grep -q "Attempts used" src/components/evidara/live-student-tests.tsx
          grep -q "highest_attempt_already_used" supabase/migrations/20260923093000_allow_attempt_limit_edits_after_attempts.sql
      - name: Remove temporary patch machinery
        run: rm -f scripts/apply-attempt-limit-edit.py .github/workflows/apply-attempt-limit-edit.yml
      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Allow attempt-limit edits without touching completed attempts"
          git push origin HEAD:fix/edit-attempt-limit-after-attempts-2026-09-23

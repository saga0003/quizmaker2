name: D6 Filter Patch

on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/d6-filter-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - run: python scripts/d6_filter_patch.py
      - run: |
          git config user.name "Evidara Phase 1 Hardening"
          git config user.email "sagar@smis.edu.in"
          git add src/components/evidara/paper-assignment-center.tsx
          git commit -m "feat(d6): add explicit all-students audience preset"
          git push origin HEAD:phase1-hardening

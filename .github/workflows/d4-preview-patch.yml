name: D4 Preview Patch

on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/d4-preview-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Apply guarded D4 patch
        run: python scripts/d4_preview_patch.py
      - name: Commit component patch
        run: |
          git config user.name "Evidara Phase 1 Hardening"
          git config user.email "sagar@smis.edu.in"
          git add src/components/evidara/paper-assignment-center.tsx
          git commit -m "feat(d4): show server eligibility warnings in assignment preview"
          git push origin HEAD:phase1-hardening

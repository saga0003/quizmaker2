name: Phase 1 F13 apply
on:
  push:
    branches: [phase1-hardening]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[f13-apply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply F13 source changes
        shell: bash
        run: |
          cat > supabase/migrations/20260901142000_phase1_institution_attempt_aggregate_scaling.sql <<'EOF'
          create index if not exists exam_attempts_org_student_submitted_idx
            on public.exam_attempts (organization_id, student_id, submitted_at desc)
            where status = 'submitted';

          create or replace function public.get_institution_student_attempt_metrics_v1(
            p_organization_id uuid,
            p_student_ids uuid[] default null
          )
          returns table (
            student_id uuid,
            completed_tests bigint,
            percentage_sum numeric,
            average_percentage numeric,
            correct_count bigint,
            incorrect_count bigint,
            unanswered_count bigint,
            highest_percentage numeric,
            lowest_percentage numeric,
            last_test_at timestamptz
          )
          language sql
          stable
          security invoker
          set search_path = public
          as $$
            select
              a.student_id,
              count(*)::bigint as completed_tests,
              coalesce(sum(a.percentage), 0)::numeric as percentage_sum,
              avg(a.percentage)::numeric as average_percentage,
              coalesce(sum(a.correct_count), 0)::bigint as correct_count,
              coalesce(sum(a.incorrect_count), 0)::bigint as incorrect_count,
              coalesce(sum(a.unanswered_count), 0)::bigint as unanswered_count,
              max(a.percentage)::numeric as highest_percentage,
              min(a.percentage)::numeric as lowest_percentage,
              max(a.submitted_at) as last_test_at
            from public.exam_attempts a
            where a.status = 'submitted'
              and (
                a.organization_id = p_organization_id
                or (
                  a.organization_id is null
                  and exists (
                    select 1 from public.student_school_memberships ssm
                    where ssm.organization_id = p_organization_id
                      and ssm.student_id = a.student_id
                      and ssm.status = 'active'
                  )
                )
              )
              and (p_student_ids is null or a.student_id = any(p_student_ids))
            group by a.student_id;
          $$;

          revoke all on function public.get_institution_student_attempt_metrics_v1(uuid, uuid[]) from public, anon, authenticated;
          grant execute on function public.get_institution_student_attempt_metrics_v1(uuid, uuid[]) to service_role;
          comment on function public.get_institution_student_attempt_metrics_v1(uuid, uuid[]) is
            'Phase 1 F13 server-only aggregate: collapses submitted attempt rows to one row per student before institution analytics leaves PostgreSQL.';
          EOF

          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/api/institution-analytics/route.ts')
          s = p.read_text()

          attempt_type = """type AttemptRow = {\n  id: string;\n  paper_id: string;\n  student_id: string;\n  organization_id: string | null;\n  percentage: number | string | null;\n  correct_count: number | null;\n  incorrect_count: number | null;\n  unanswered_count: number | null;\n  submitted_at: string | null;\n  status: string;\n};\n"""
          metric_type = attempt_type + """\ntype AttemptMetricRow = {\n  student_id: string;\n  completed_tests: number | string;\n  percentage_sum: number | string | null;\n  average_percentage: number | string | null;\n  correct_count: number | string | null;\n  incorrect_count: number | string | null;\n  unanswered_count: number | string | null;\n  highest_percentage: number | string | null;\n  lowest_percentage: number | string | null;\n  last_test_at: string | null;\n};\n"""
          if attempt_type not in s: raise SystemExit('AttemptRow type anchor missing')
          s = s.replace(attempt_type, metric_type, 1)

          insert_anchor = "function studentMetrics(studentId: string, attempts: AttemptRow[]) {"
          helper = """async function attemptMetricsForStudents(ctx: CloudContext, studentIds: string[], organizationId: string) {\n  if (!studentIds.length) return [] as AttemptMetricRow[];\n  const output: AttemptMetricRow[] = [];\n  for (let start = 0; start < studentIds.length; start += 500) {\n    const { data, error } = await ctx.admin.rpc('get_institution_student_attempt_metrics_v1', {\n      p_organization_id: organizationId,\n      p_student_ids: studentIds.slice(start, start + 500),\n    });\n    if (error) throw new Error(error.message);\n    output.push(...((data || []) as AttemptMetricRow[]));\n  }\n  return output;\n}\n\nfunction submittedAttemptCount(metrics: AttemptMetricRow[]) {\n  return metrics.reduce((sum, row) => sum + number(row.completed_tests), 0);\n}\n\n"""
          if insert_anchor not in s: raise SystemExit('studentMetrics anchor missing')
          s = s.replace(insert_anchor, helper + insert_anchor, 1)

          scope_anchor = "function rankScopeRows<T extends { averagePercentage: number | null; rank: number }>(rows: T[]) {"
          scope_helper = """function scopeAggregateMetrics(memberships: MembershipRow[], metrics: AttemptMetricRow[]) {\n  const studentIds = new Set(memberships.map((row) => row.student_id));\n  const rows = metrics.filter((row) => studentIds.has(row.student_id));\n  const completedTests = submittedAttemptCount(rows);\n  const percentageSum = rows.reduce((sum, row) => sum + number(row.percentage_sum), 0);\n  const correct = rows.reduce((sum, row) => sum + number(row.correct_count), 0);\n  const incorrect = rows.reduce((sum, row) => sum + number(row.incorrect_count), 0);\n  const participants = rows.filter((row) => number(row.completed_tests) > 0).length;\n  const highs = rows.map((row) => row.highest_percentage == null ? null : number(row.highest_percentage)).filter((value): value is number => value !== null);\n  const lows = rows.map((row) => row.lowest_percentage == null ? null : number(row.lowest_percentage)).filter((value): value is number => value !== null);\n  return {\n    studentCount: studentIds.size,\n    completedTests,\n    averageTestsPerStudent: studentIds.size ? rounded(completedTests / studentIds.size) : 0,\n    averagePercentage: completedTests ? rounded(percentageSum / completedTests) : null,\n    accuracy: correct + incorrect ? rounded(correct / (correct + incorrect) * 100) : null,\n    participation: studentIds.size ? rounded(participants / studentIds.size * 100) : null,\n    highestPercentage: highs.length ? Math.max(...highs) : null,\n    lowestPercentage: lows.length ? Math.min(...lows) : null,\n    lastTestAt: rows.map((row) => row.last_test_at).filter((value): value is string => Boolean(value)).sort().at(-1) || null,\n    rank: 0,\n  };\n}\n\n"""
          if scope_anchor not in s: raise SystemExit('rankScopeRows anchor missing')
          s = s.replace(scope_anchor, scope_helper + scope_anchor, 1)

          old = """  const studentIds = [...new Set(memberships.map((row) => row.student_id))];\n  const attempts = await attemptsForStudents(ctx, studentIds);\n  const sections = await paged<SectionRow>((from, to) => ctx.admin\n"""
          new = """  const metricsByOrganization = new Map<string, AttemptMetricRow[]>();\n  for (const organizationId of organizationIds) {\n    const orgStudentIds = [...new Set(memberships.filter((row) => row.organization_id === organizationId).map((row) => row.student_id))];\n    metricsByOrganization.set(organizationId, await attemptMetricsForStudents(ctx, orgStudentIds, organizationId));\n  }\n  const totalSubmittedAttempts = [...metricsByOrganization.values()].reduce((sum, rows) => sum + submittedAttemptCount(rows), 0);\n  const sections = await paged<SectionRow>((from, to) => ctx.admin\n"""
          if old not in s: raise SystemExit('schoolList loader anchor missing')
          s = s.replace(old, new, 1)

          start = s.index("  const schools: InstitutionSchoolRow[] = (organizations || []).map((organization) => {")
          end = s.index("\n\n  return {\n    mode: 'live',\n    level: 'schools',", start)
          school_block = """  const schools: InstitutionSchoolRow[] = (organizations || []).map((organization) => {\n    const orgMemberships = memberships.filter((row) => row.organization_id === organization.id);\n    const orgMetrics = metricsByOrganization.get(organization.id) || [];\n    return {\n      id: organization.id,\n      name: organization.name,\n      city: organization.city,\n      state: organization.state,\n      board: organization.board,\n      status: organization.status,\n      totalStudents: new Set(orgMemberships.map((row) => row.student_id)).size,\n      totalClasses: sections.filter((row) => row.organization_id === organization.id).length,\n      ...scopeAggregateMetrics(orgMemberships, orgMetrics),\n    };\n  }).sort((a, b) => (b.averagePercentage ?? -1) - (a.averagePercentage ?? -1)).map((row, index) => ({ ...row, rank: index + 1 }));"""
          s = s[:start] + school_block + s[end:]
          s = s.replace("submittedAttempts: attempts.length,\n      classifiedResponses: 0,\n      hasLiveEvidence: attempts.length > 0,\n      note: attempts.length ? undefined : 'Live school records loaded. No submitted assessment attempts are available yet.'", "submittedAttempts: totalSubmittedAttempts,\n      classifiedResponses: 0,\n      hasLiveEvidence: totalSubmittedAttempts > 0,\n      note: totalSubmittedAttempts ? undefined : 'Live school records loaded. No submitted assessment attempts are available yet.'", 1)

          old = "  const attempts = await attemptsForStudents(ctx, [...new Set(permittedMemberships.map((row) => row.student_id))], organizationId);"
          new = "  const aggregateMetrics = await attemptMetricsForStudents(ctx, [...new Set(permittedMemberships.map((row) => row.student_id))], organizationId);"
          if old not in s: raise SystemExit('schoolClasses attempt anchor missing')
          s = s.replace(old, new, 1)
          class_start = s.index("  const classes: InstitutionClassRow[] = sections.map((section) => {")
          class_end = s.index("\n\n  const programmeKeys", class_start)
          class_block = """  const classes: InstitutionClassRow[] = sections.map((section) => {\n    const members = permittedMemberships.filter((row) => row.section_id === section.id);\n    return {\n      id: section.id,\n      organizationId,\n      academicYear: section.academic_year,\n      grade: section.grade,\n      name: `Grade ${section.grade} · ${section.name}`,\n      code: section.code,\n      ...scopeAggregateMetrics(members, aggregateMetrics),\n    };\n  }).sort((a, b) => (b.averagePercentage ?? -1) - (a.averagePercentage ?? -1)).map((row, index) => ({ ...row, rank: index + 1 }));"""
          s = s[:class_start] + class_block + s[class_end:]
          s = s.replace("...scopeMetrics(membershipsForProgramme(permittedMemberships, programmeId), attempts)", "...scopeAggregateMetrics(membershipsForProgramme(permittedMemberships, programmeId), aggregateMetrics)", 1)
          s = s.replace("submittedAttempts: attempts.length,\n      classifiedResponses: 0,\n      hasLiveEvidence: attempts.length > 0,\n      note: attempts.length ? undefined : 'Live classes and enrolments loaded. Results will appear after students submit assessments.'", "submittedAttempts: submittedAttemptCount(aggregateMetrics),\n      classifiedResponses: 0,\n      hasLiveEvidence: submittedAttemptCount(aggregateMetrics) > 0,\n      note: submittedAttemptCount(aggregateMetrics) ? undefined : 'Live classes and enrolments loaded. Results will appear after students submit assessments.'", 1)

          old = "  const attempts = await attemptsForStudents(ctx, [...new Set(scoped.map((row) => row.student_id))], organizationId);"
          new = "  const aggregateMetrics = await attemptMetricsForStudents(ctx, [...new Set(scoped.map((row) => row.student_id))], organizationId);"
          if old not in s: raise SystemExit('programme attempt anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace("...scopeMetrics(scoped.filter((row) => row.grade === grade), attempts)", "...scopeAggregateMetrics(scoped.filter((row) => row.grade === grade), aggregateMetrics)", 1)
          s = s.replace("evidence: { submittedAttempts: attempts.length, classifiedResponses: 0, hasLiveEvidence: attempts.length > 0,\n      note: attempts.length ? undefined : 'Live programme roster loaded. Results will appear after students submit assessments.' }", "evidence: { submittedAttempts: submittedAttemptCount(aggregateMetrics), classifiedResponses: 0, hasLiveEvidence: submittedAttemptCount(aggregateMetrics) > 0,\n      note: submittedAttemptCount(aggregateMetrics) ? undefined : 'Live programme roster loaded. Results will appear after students submit assessments.' }", 1)

          old = "  const attempts = await attemptsForStudents(ctx, [...new Set(permitted.map((row) => row.student_id))], organizationId);"
          new = "  const aggregateMetrics = await attemptMetricsForStudents(ctx, [...new Set(permitted.map((row) => row.student_id))], organizationId);"
          if old not in s: raise SystemExit('grade attempt anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace("...scopeMetrics(permitted.filter((row) => row.section_id === section.id), attempts)", "...scopeAggregateMetrics(permitted.filter((row) => row.section_id === section.id), aggregateMetrics)", 1)
          s = s.replace("evidence: { submittedAttempts: attempts.length, classifiedResponses: 0, hasLiveEvidence: attempts.length > 0,\n      note: attempts.length ? undefined : 'Live grade and section roster loaded. Results will appear after students submit assessments.' }", "evidence: { submittedAttempts: submittedAttemptCount(aggregateMetrics), classifiedResponses: 0, hasLiveEvidence: submittedAttemptCount(aggregateMetrics) > 0,\n      note: submittedAttemptCount(aggregateMetrics) ? undefined : 'Live grade and section roster loaded. Results will appear after students submit assessments.' }", 1)

          p.write_text(s)
          PY

          cat > scripts/f13-institution-aggregate-scaling-smoke.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = process.cwd();
          const read = (file) => fs.readFileSync(path.join(root, file), 'utf8');
          const route = read('src/app/api/institution-analytics/route.ts');
          const migration = read('supabase/migrations/20260901142000_phase1_institution_attempt_aggregate_scaling.sql');
          const failures = [];
          let passed = 0;
          const check = (label, condition) => { if (condition) { passed += 1; console.log(`✓ ${label}`); } else { failures.push(label); console.error(`✗ ${label}`); } };
          const body = (name, next) => route.slice(route.indexOf(`async function ${name}`), route.indexOf(`async function ${next}`));
          const schoolList = body('schoolList', 'schoolClasses');
          const schoolClasses = body('schoolClasses', 'programmeSnapshot');
          const programme = body('programmeSnapshot', 'gradeSnapshot');
          const grade = body('gradeSnapshot', 'classStudents');
          const classStudents = body('classStudents', 'responseEvidence');
          check('database aggregate RPC is defined', /get_institution_student_attempt_metrics_v1/.test(migration));
          check('aggregate RPC is SECURITY INVOKER', /security invoker/i.test(migration));
          check('browser roles cannot execute aggregate RPC', /revoke all[\s\S]*from public, anon, authenticated/i.test(migration));
          check('only service role receives execute permission', /grant execute[\s\S]*to service_role/i.test(migration));
          check('submitted-attempt covering index is defined', /exam_attempts_org_student_submitted_idx/.test(migration));
          check('route calls database aggregate in bounded student batches', /get_institution_student_attempt_metrics_v1/.test(route) && /start \+= 500/.test(route));
          check('school list no longer downloads raw submitted attempts', !/attemptsForStudents/.test(schoolList) && /attemptMetricsForStudents/.test(schoolList));
          check('school class summaries no longer download raw submitted attempts', !/attemptsForStudents/.test(schoolClasses) && /attemptMetricsForStudents/.test(schoolClasses));
          check('programme summaries use database aggregates', !/attemptsForStudents/.test(programme) && /attemptMetricsForStudents/.test(programme));
          check('grade summaries use database aggregates', !/attemptsForStudents/.test(grade) && /attemptMetricsForStudents/.test(grade));
          check('weighted average preserves attempt-level semantics', /percentageSum \/ completedTests/.test(route));
          check('question evidence path intentionally keeps raw attempt IDs', /attemptsForStudents/.test(classStudents));
          check('server evidence counts sum database aggregate attempt counts', /submittedAttemptCount\(aggregateMetrics\)/.test(route));
          if (failures.length) { console.error(`\nF13 aggregate scaling smoke failed: ${failures.length} failed, ${passed} passed.`); process.exit(1); }
          console.log(`\nF13 aggregate scaling checks passed (${passed} checks).`);
          EOF

          node scripts/f13-institution-aggregate-scaling-smoke.mjs
          npm run typecheck -- --incremental false
      - name: Commit F13 implementation
        shell: bash
        run: |
          git config user.name 'Evidara Phase 1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/app/api/institution-analytics/route.ts supabase/migrations/20260901142000_phase1_institution_attempt_aggregate_scaling.sql scripts/f13-institution-aggregate-scaling-smoke.mjs
          git commit -m 'feat(f13): move institution summaries to database aggregates [f13-apply]'
          git push

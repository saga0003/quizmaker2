name: Phase1 R14 Transition Patch

on:
  push:
    branches: [phase1-hardening]
    paths:
      - '.github/workflows/phase1-r14-transition-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Extend R14 analytics transition wait
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/phase1-r14-rendered-acceptance-v2.mjs')
          s = p.read_text()
          old = 'async function waitForHierarchyTransition(page, nextToken, timeout = 6000) {'
          new = 'async function waitForHierarchyTransition(page, nextToken, timeout = 30000) {'
          if s.count(old) != 1:
              raise SystemExit(f'guard failed: expected exactly one transition timeout declaration, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit guarded acceptance change
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/phase1-r14-rendered-acceptance-v2.mjs
          git commit -m 'test(r14): wait for in-flight analytics transition'
          git push origin HEAD:phase1-hardening

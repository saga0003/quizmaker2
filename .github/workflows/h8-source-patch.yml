name: H8 Source Patch

on:
  push:
    branches:
      - phase1-hardening

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'stage mobile analytics source patch retry')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Apply guarded H8 patch
        run: python scripts/h8-apply-mobile-patch.py
      - name: Commit source patch
        run: |
          git config user.name "evidara-phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/institution-analytics/institution-analytics-workspace.tsx
          git commit -m "feat(h8): add mobile cards for analytics tables"
          git push origin HEAD:phase1-hardening

  heartbeat:
    if: contains(github.event.head_commit.message, 'record R13 hourly heartbeat')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Append R13 hourly heartbeat
        shell: bash
        run: |
          set -euo pipefail
          marker='## 2026-09-03 17:46:44–18:01:41 IST — R13 rendered analytics acceptance hardening'
          if grep -Fq "$marker" PHASE1_PROGRESS_LOG.md; then
            echo 'Heartbeat already present.'
            exit 0
          fi
          cat >> PHASE1_PROGRESS_LOG.md <<'EOF'


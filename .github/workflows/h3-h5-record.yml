name: Record H3 H5 verified checkpoint
on:
  push:
    branches: [phase1-hardening]
    paths:
      - '.github/workflows/h3-h5-record.yml'
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Update checklist and progress log
        run: |
          python - <<'PY'
          from pathlib import Path
          checklist = Path('PHASE1_RELEASE_CHECKLIST.md')
          text = checklist.read_text()
          replacements = {
            "- [ ] H3 School Admin dashboard focuses on students, teachers, tests, participation, score, licence usage and actions.": "- [x] H3 School Admin dashboard focuses on students, teachers, tests, participation, score, licence usage and actions — verified 1 Sep 2026. The live School Admin dashboard now exposes these six first-class metrics with measured participation/score preserving unavailable evidence as `—`, plus direct student/teacher/test/result actions. Exact candidate `36e2ba78c874ebfb2cfe8f7a1a4b47baaba1a24f` passed complete release gate `33526523379`.",
            "- [ ] H4 Teacher dashboard focuses on Upload Questions, Create Test, Upcoming Tests, Recent Results, Students Needing Attention.": "- [x] H4 Teacher dashboard focuses on Upload Questions, Create Test, Upcoming Tests, Recent Results, Students Needing Attention — verified 1 Sep 2026. Teacher quick actions now use the Phase-1 task language and the existing evidence-first Students Needing Attention queue remains first-class. Permanent H3–H5 regression passed complete release gate `33526523379`.",
            "- [ ] H5 Student dashboard focuses on Next Test, Recent Result, Improvement and Focus Topics.": "- [x] H5 Student dashboard focuses on Next Test, Recent Result, Improvement and Focus Topics — verified 1 Sep 2026. Student home now surfaces the next eligible test, latest submitted result, two-test improvement delta and a link to released evidence-based focus topics without inventing priorities when evidence is insufficient. Permanent H3–H5 regression passed complete release gate `33526523379`."
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing checklist line: {old}')
            text = text.replace(old, new, 1)
          checklist.write_text(text)

          log = Path('PHASE1_PROGRESS_LOG.md')
          existing = log.read_text()
          entry = '''\n\n## 2026-09-01 20:55:12–21:07:13 IST — H3/H4/H5 role dashboards verified / hourly heartbeat\n\n- **Run start/end:** 2026-09-01 20:55:12 IST → 2026-09-01 21:07:13 IST.\n- **Active engineering/review span:** approximately **12 minutes** of branch/CI/production/database inspection, H1/H2 reconciliation, H3–H5 implementation, regression correction, release-gate wiring and final verification. The requested 45–50 minute target was **not met** because this execution window ended materially earlier; no idle padding was added.\n- **Section worked:** H — Role-focused UI/UX.\n- **Checklist items completed this run:** H1, H2, H3, H4, H5. H1/H2 were reconciled from already-green implementation; H3–H5 were implemented and fully verified in this run.\n- **Items still pending:** H6 standardized UI states, H7 responsive QA, H8 mobile table readability, H9 accessibility baseline; then I, J, real-school acceptance, load acceptance and production sign-off.\n- **Starting branch head:** `cc16ea41de9e4d0491cc99c1936c1740d9c31fcf`.\n- **Functional/release candidate:** `36e2ba78c874ebfb2cfe8f7a1a4b47baaba1a24f` (`ci(h3-h5): enforce role-dashboard regression`).\n- **Commits created/reconciled:** `a1eea1bd95f08dd78bab6851181fcc93a412d647` H1/H2 record, `5ed7867042e69fab53e1826982728f2ca76fd888` H3–H5 product implementation, `b92f579bef81c345ca5818cef0e31ae2140186ec` regression assertion-count correction, `36e2ba78c874ebfb2cfe8f7a1a4b47baaba1a24f` permanent release-gate wiring, plus this documentation recorder.\n- **Implementation result:** School Admin home now prioritizes Students, Teachers, Tests, Participation, Score and Licence usage with task actions; teacher home prioritizes Upload Questions, Create Test, Upcoming Tests, Recent Results and Students Needing Attention; student home prioritizes Next Test, Recent Result, Improvement and Focus Topics. Missing measured school metrics fail closed to `—`, and student Focus Topics routes to released evidence rather than invented recommendations.\n- **Verification/rework:** The 22-point H3–H5 smoke passed in the complete gate. The first smoke implementation had a reporting-only assertion-count typo (`19` instead of the actual `22` checks); it was corrected before the exact candidate was accepted. An intermediate release run was cancelled normally by branch concurrency while the final gate was wired; no functional regression remained.\n- **CI:** GitHub Actions release gate `33526523379`, 2026-09-01 21:04:09–21:07:13 IST, duration **3m 04s — PASS**. H1/H2 and H3/H4/H5 permanent checks, TypeScript, lint, every required regression and production build all passed.\n- **Vercel/Supabase state:** Permanent Vercel production remained protected and unchanged; production runtime inspection found no errors in the preceding 24 hours. Head preview status remains subject to the known Hobby-plan build-rate limit rather than a product runtime failure. Connected Supabase projects were `ACTIVE_HEALTHY`; H1–H5 required no database mutation.\n- **Rework/failures/blockers:** No production incident or final verification blocker. One regression output-count typo was corrected; transient CI concurrency cancellation was expected.\n- **Section progress:** H is **5/9 verified (55.6%)**.\n- **Overall Phase 1 progress:** **82/129 verified (63.6%)**.\n- **Exact next action:** H6 — audit and standardize headings, cards, tables, filters, loading states, error states and empty states across Phase-1 workspaces; add permanent regression coverage and run the complete release gate, then continue immediately to H7 responsive acceptance if H6 clears.\n'''
          if '20:55:12–21:07:13 IST — H3/H4/H5 role dashboards verified' not in existing:
            log.write_text(existing + entry)
          PY
      - name: Remove recorder workflow and commit
        run: |
          rm .github/workflows/h3-h5-record.yml
          git config user.name 'Evidara Phase 1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md .github/workflows/h3-h5-record.yml
          git commit -m 'docs(h3-h5): record verified role dashboards [skip ci]'
          git push origin HEAD:phase1-hardening

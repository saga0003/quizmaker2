name: Apply full admin edit patch

on:
  push:
    branches:
      - fix/full-admin-edit-after-attempts-2026-09-23

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-admin-edit-after-attempts-2026-09-23
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply frontend patch
        run: node scripts/apply-full-admin-edit-after-attempts.mjs

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify post-attempt full-admin guardrails
        shell: bash
        run: |
          set -euo pipefail
          FILE=src/components/evidara/live-paper-catalogue-v8.tsx
          grep -q "postAttemptLimitedEdit = editingPaperHasAttempts && !canApprove" "$FILE"
          grep -q "save_question_paper_revisioned_v1" "$FILE"
          grep -q "eq('is_active', true)" "$FILE"
          grep -q "Existing student history was preserved" "$FILE"
          ! grep -q "disabled={editingPaperHasAttempts && item.step !== 4}" "$FILE"
          ! grep -q "disabled={editingPaperHasAttempts}" "$FILE"
          test -f supabase/migrations/20260923094500_revision_safe_full_admin_paper_editing.sql
          test -f supabase/migrations/20260923094600_freeze_attempt_content_across_paper_edits.sql
          test -f supabase/migrations/20260923094700_scope_current_paper_operations_and_historical_analytics.sql
          test -f supabase/migrations/20260923094800_guard_attempt_limit_not_below_used.sql

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-full-admin-edit-after-attempts.mjs
          rm .github/workflows/apply-full-admin-edit-after-attempts.yml

      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Enable full admin paper edits while preserving attempt history"
          git push origin HEAD:fix/full-admin-edit-after-attempts-2026-09-23

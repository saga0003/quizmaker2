name: Phase 1 R14 Drilldown Acceptance

on:
  push:
    branches: [phase1-hardening]
    paths:
      - .github/workflows/phase1-r14-drilldown-acceptance.yml
      - scripts/phase1-r14-rendered-acceptance-v2.mjs
      - .phase1-r14-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r14-drilldowns:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDARA_LOAD_ACCEPTANCE: YES_I_UNDERSTAND_NON_PRODUCTION_ONLY
      EVIDARA_ACCEPTANCE_MODE: same-project-isolated-tenant
      EVIDARA_ACCEPTANCE_SUPABASE_REF: xzfozpnzvznqrvcsoail
      EVIDARA_ACCEPTANCE_DB_BYTES: 219344019
      EVIDARA_ACCEPTANCE_ORG_SLUG: evidara-school-acceptance
      EVIDARA_ACCEPTANCE_URL: https://quizmaker2-git-phase1-hardening-saga0003s-projects.vercel.app
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      EVIDARA_ACCEPTANCE_SCHOOL_ADMIN_EMAIL: ${{ secrets.EVIDARA_ACCEPTANCE_SCHOOL_ADMIN_EMAIL }}
      EVIDARA_ACCEPTANCE_SCHOOL_ADMIN_PASSWORD: ${{ secrets.EVIDARA_ACCEPTANCE_SCHOOL_ADMIN_PASSWORD }}
      EVIDARA_ACCEPTANCE_TEACHER_EMAIL: ${{ secrets.EVIDARA_ACCEPTANCE_TEACHER_EMAIL }}
      EVIDARA_ACCEPTANCE_TEACHER_PASSWORD: ${{ secrets.EVIDARA_ACCEPTANCE_TEACHER_PASSWORD }}
      EVIDARA_ACCEPTANCE_EVIDENCE_DIR: acceptance-evidence/r14-drilldowns
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify isolated protected-preview R14 target
        shell: bash
        run: |
          set -euo pipefail
          test "$EVIDARA_ACCEPTANCE_ORG_SLUG" = "evidara-school-acceptance"
          test "$EVIDARA_ACCEPTANCE_URL" = "https://quizmaker2-git-phase1-hardening-saga0003s-projects.vercel.app"
          test "$EVIDARA_ACCEPTANCE_DB_BYTES" = "219344019"
          for name in EVIDARA_ACCEPTANCE_SCHOOL_ADMIN_EMAIL EVIDARA_ACCEPTANCE_SCHOOL_ADMIN_PASSWORD EVIDARA_ACCEPTANCE_TEACHER_EMAIL EVIDARA_ACCEPTANCE_TEACHER_PASSWORD VERCEL_AUTOMATION_BYPASS_SECRET; do
            test -n "${!name:-}" || { echo "::error title=R14 secret missing::$name is not configured"; exit 1; }
          done
          node scripts/phase1-acceptance-preflight.mjs --target "$EVIDARA_ACCEPTANCE_URL" --dry-run
          curl --fail --silent --show-error --output /dev/null \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "$EVIDARA_ACCEPTANCE_URL/"
          node scripts/f8-institution-drilldown-smoke.mjs
          node scripts/f9-teacher-needs-attention-smoke.mjs
      - name: Install Playwright without changing lockfile
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute R14 rendered Teacher and School Admin drilldowns
        run: node scripts/phase1-r14-rendered-acceptance-v2.mjs
      - name: Upload redacted R14 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-r14-drilldowns-${{ github.sha }}
          path: acceptance-evidence/r14-drilldowns
          if-no-files-found: warn
          retention-days: 14

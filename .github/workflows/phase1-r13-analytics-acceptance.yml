name: Phase 1 R13 Analytics Acceptance

on:
  push:
    branches: [phase1-hardening]
    paths:
      - .github/workflows/phase1-r13-analytics-acceptance.yml
      - scripts/phase1-r13-rendered-acceptance.mjs
      - .phase1-r13-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r13-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDARA_LOAD_ACCEPTANCE: YES_I_UNDERSTAND_NON_PRODUCTION_ONLY
      EVIDARA_ACCEPTANCE_MODE: same-project-isolated-tenant
      EVIDARA_ACCEPTANCE_SUPABASE_REF: xzfozpnzvznqrvcsoail
      EVIDARA_ACCEPTANCE_ORG_SLUG: evidara-school-acceptance
      EVIDARA_ACCEPTANCE_URL: https://quizmaker2-git-phase1-hardening-saga0003s-projects.vercel.app
      EVIDARA_ACCEPTANCE_DB_BYTES: '219344019'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      EVIDARA_ACCEPTANCE_STUDENT_EMAIL: ${{ secrets.EVIDARA_ACCEPTANCE_STUDENT_EMAIL }}
      EVIDARA_ACCEPTANCE_STUDENT_PASSWORD: ${{ secrets.EVIDARA_ACCEPTANCE_STUDENT_PASSWORD }}
      EVIDARA_ACCEPTANCE_EVIDENCE_DIR: acceptance-evidence/r13-analytics
      NEXT_PUBLIC_SUPABASE_URL: https://xzfozpnzvznqrvcsoail.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_zXOjaJgFSLZV54Xs9ekk4Q_QuJQAhgZ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify isolated protected-preview R13 target
        shell: bash
        run: |
          set -euo pipefail
          test "$EVIDARA_ACCEPTANCE_ORG_SLUG" = "evidara-school-acceptance"
          test "$EVIDARA_ACCEPTANCE_URL" = "https://quizmaker2-git-phase1-hardening-saga0003s-projects.vercel.app"
          test -n "${EVIDARA_ACCEPTANCE_STUDENT_EMAIL:-}"
          test -n "${EVIDARA_ACCEPTANCE_STUDENT_PASSWORD:-}"
          test -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" || { echo '::error title=R13 automation bypass missing::Configure VERCEL_AUTOMATION_BYPASS_SECRET in GitHub Actions.'; exit 1; }
          node scripts/phase1-acceptance-preflight.mjs --target "$EVIDARA_ACCEPTANCE_URL" --dry-run
          curl --fail --silent --show-error --output /dev/null \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "$EVIDARA_ACCEPTANCE_URL/"
      - name: Install Playwright without changing lockfile
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Align subject-card assertion with rendered UI contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/phase1-r13-rendered-acceptance.mjs')
          text = path.read_text()
          old = "[SUBJECT, CHAPTER, '5 correct', '100%']"
          new = "[SUBJECT, CHAPTER, 'CORRECT', '5', '100%']"
          if old not in text:
              raise SystemExit('Expected R13 subject assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Execute R13 rendered analytics reconciliation
        run: node scripts/phase1-r13-rendered-acceptance.mjs
      - name: Upload redacted R13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-r13-analytics-${{ github.sha }}
          path: acceptance-evidence/r13-analytics
          if-no-files-found: warn
          retention-days: 14
name: Phase 1 R13 Analytics Acceptance

on:
  push:
    branches: [phase1-hardening]
    paths:
      - .github/workflows/phase1-r13-analytics-acceptance.yml
      - scripts/phase1-r13-rendered-acceptance.mjs
      - .phase1-r13-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r13-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDARA_LOAD_ACCEPTANCE: YES_I_UNDERSTAND_NON_PRODUCTION_ONLY
      EVIDARA_ACCEPTANCE_MODE: same-project-isolated-tenant
      EVIDARA_ACCEPTANCE_SUPABASE_REF: xzfozpnzvznqrvcsoail
      EVIDARA_ACCEPTANCE_ORG_SLUG: evidara-school-acceptance
      EVIDARA_ACCEPTANCE_URL: https://quizmaker2-git-phase1-hardening-saga0003s-projects.vercel.app
      EVIDARA_ACCEPTANCE_DB_BYTES: '219344019'
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      EVIDARA_ACCEPTANCE_STUDENT_EMAIL: ${{ secrets.EVIDARA_ACCEPTANCE_STUDENT_EMAIL }}
      EVIDARA_ACCEPTANCE_STUDENT_PASSWORD: ${{ secrets.EVIDARA_ACCEPTANCE_STUDENT_PASSWORD }}
      EVIDARA_ACCEPTANCE_EVIDENCE_DIR: acceptance-evidence/r13-analytics
      NEXT_PUBLIC_SUPABASE_URL: https://xzfozpnzvznqrvcsoail.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_zXOjaJgFSLZV54Xs9ekk4Q_QuJQAhgZ
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify isolated protected-preview R13 target
        shell: bash
        run: |
          set -euo pipefail
          test "$EVIDARA_ACCEPTANCE_ORG_SLUG" = "evidara-school-acceptance"
          test "$EVIDARA_ACCEPTANCE_URL" = "https://quizmaker2-git-phase1-hardening-saga0003s-projects.vercel.app"
          test -n "${EVIDARA_ACCEPTANCE_STUDENT_EMAIL:-}"
          test -n "${EVIDARA_ACCEPTANCE_STUDENT_PASSWORD:-}"
          test -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" || { echo '::error title=R13 automation bypass missing::Configure VERCEL_AUTOMATION_BYPASS_SECRET in GitHub Actions.'; exit 1; }
          node scripts/phase1-acceptance-preflight.mjs --target "$EVIDARA_ACCEPTANCE_URL" --dry-run
          curl --fail --silent --show-error --output /dev/null \
            -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
            "$EVIDARA_ACCEPTANCE_URL/"
      - name: Install Playwright without changing lockfile
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Align rendered R13 assertions with the current UI contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/phase1-r13-rendered-acceptance.mjs')
          text = path.read_text()
          old_subject = "[SUBJECT, CHAPTER, '5 correct', '100%']"
          new_subject = "[SUBJECT, CHAPTER, 'CORRECT', '5', '100%']"
          if old_subject in text:
              text = text.replace(old_subject, new_subject, 1)

          old = '''    const evidence = page.locator('[data-f4-question-evidence]');
    await evidence.waitFor({ state: 'visible', timeout: 10000 });
    const evidenceText = await evidence.innerText();
    const renderedCorrect = (evidenceText.match(/\\bCorrect\\b/g) || []).length;
    const renderedUnanswered = (evidenceText.match(/\\bUnanswered\\b/g) || []).length;
    if (renderedCorrect !== 5 || renderedUnanswered !== 55) throw new Error(`R13 rendered question outcomes mismatch: ${renderedCorrect} correct / ${renderedUnanswered} unanswered`);
    for (const token of [`${PAPER_TITLE} · Q1`, `${PAPER_TITLE} · Q2`, '+4 marks', `${SUBJECT} · ${CHAPTER} · ${TOPIC}`]) if (!evidenceText.includes(token)) throw new Error(`R13 question intelligence missing ${token}`);
    body = await page.locator('body').innerText();
    if (!body.includes('60 outcomes')) throw new Error('R13 question intelligence missing 60-outcome reconciliation');'''
          new = '''    const auditHeading = page.getByRole('heading', { name: 'Question Response Audit' });
    await auditHeading.waitFor({ state: 'visible', timeout: 10000 });
    const auditButton = page.getByRole('button', { name: /Question Response Audit/ });
    const auditBody = await page.locator('body').innerText();
    if (!auditBody.includes('60 question responses')) throw new Error('R13 question audit missing 60 exposure rows');
    if (!auditBody.includes('Correct\\n5') || !auditBody.includes('Unanswered\\n55')) {
      if (await auditButton.count()) await auditButton.click();
    }
    const table = page.getByRole('table').last();
    await table.waitFor({ state: 'visible', timeout: 10000 });
    const dataRows = table.getByRole('row').filter({ hasText: PAPER_TITLE });
    const rowCount = await dataRows.count();
    let renderedCorrect = 0;
    let renderedUnanswered = 0;
    let sawFourMarks = false;
    let sawTaxonomy = false;
    for (let index = 0; index < rowCount; index += 1) {
      const rowText = await dataRows.nth(index).innerText();
      if (rowText.includes('Correct')) renderedCorrect += 1;
      if (rowText.includes('Unanswered')) renderedUnanswered += 1;
      if (rowText.includes('+4')) sawFourMarks = true;
      if (rowText.includes(SUBJECT) && rowText.includes(CHAPTER) && rowText.includes(TOPIC)) sawTaxonomy = true;
    }
    if (rowCount !== 60 || renderedCorrect !== 5 || renderedUnanswered !== 55) throw new Error(`R13 rendered question outcomes mismatch: ${rowCount} rows / ${renderedCorrect} correct / ${renderedUnanswered} unanswered`);
    if (!sawFourMarks || !sawTaxonomy) throw new Error('R13 row-level paper/taxonomy/marks evidence missing');'''
          if old not in text:
              raise SystemExit('Expected R13 question-evidence assertion block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Execute R13 rendered analytics reconciliation
        run: node scripts/phase1-r13-rendered-acceptance.mjs
      - name: Upload redacted R13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-r13-analytics-${{ github.sha }}
          path: acceptance-evidence/r13-analytics
          if-no-files-found: warn
          retention-days: 14

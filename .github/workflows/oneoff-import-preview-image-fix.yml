name: One-off import preview image fix

on:
  push:
    branches:
      - fix/import-preview-local-images-2026-09-21
    paths:
      - .github/workflows/oneoff-import-preview-image-fix.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/import-preview-local-images-2026-09-21
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply preview fix
        run: python scripts/apply-import-preview-image-fix.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -- --incremental false

      - name: Lint
        run: npm run lint

      - name: Import regression smoke
        run: npm run qa:v19-1

      - name: Production build
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "Evidara Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/oneoff-import-preview-image-fix.yml scripts/apply-import-preview-image-fix.py
          git add src/components/evidara/question-bulk-import-dialog-core.tsx scripts/v19-1-latex-paper-import-smoke.mjs
          git commit -m "fix: preview bundled images before import [import-preview-image-fix]"
          git push origin HEAD:fix/import-preview-local-images-2026-09-21

name: D6 UI Patch

on:
  push:
    branches:
      - phase1-hardening
    paths:
      - '.github/workflows/d6-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply D6 UI patch
        run: python scripts/apply-d6-ui-patch.py
      - name: Verify focused D6 regression
        run: node scripts/d6-paper-publish-readiness-smoke.mjs
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch changes required."
            exit 0
          fi
          git config user.name "evidara-phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/evidara/live-paper-catalogue-v8.tsx scripts/d6-paper-publish-readiness-smoke.mjs
          git commit -m "feat(phase1): add visible D6 publish preflight"
          git push origin HEAD:phase1-hardening

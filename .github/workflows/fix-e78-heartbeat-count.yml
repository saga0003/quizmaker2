name: Fix E7 E8 heartbeat count
on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/fix-e78-heartbeat-count.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Correct dynamic checklist count
        shell: python {0}
        run: |
          from pathlib import Path
          import re
          checklist=Path('PHASE1_RELEASE_CHECKLIST.md').read_text()
          matches=re.findall(r'^- \[([ x])\]',checklist,flags=re.M)
          done=sum(1 for x in matches if x=='x')
          total=len(matches)
          pct=done*100/total if total else 0
          p=Path('PHASE1_PROGRESS_LOG.md')
          s=p.read_text()
          old='- **Overall Phase 1 checklist:** **{done}/{total} = {pct:.1f}% verified** after this update.'
          new=f'- **Overall Phase 1 checklist:** **{done}/{total} = {pct:.1f}% verified** after this update.'
          if old not in s:
            raise SystemExit('Literal placeholder heartbeat line not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/fix-e78-heartbeat-count.yml').unlink()
      - name: Commit correction
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add PHASE1_PROGRESS_LOG.md .github/workflows/fix-e78-heartbeat-count.yml
          git diff --cached --quiet || (git commit -m "docs(e7-e8): correct heartbeat checklist count [skip ci]" && git push origin HEAD:phase1-hardening)

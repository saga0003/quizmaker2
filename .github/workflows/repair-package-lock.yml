name: Repair package lock

on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/repair-package-lock.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase1-hardening

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Repair package lock for deterministic CI"
          git push origin HEAD:phase1-hardening

name: Evidara P0.6 Route Patch

on:
  push:
    branches: [phase1-hardening]
    paths:
      - scripts/apply-p06-route-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply P0.6 route patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply snapshot taxonomy patch
        run: node scripts/apply-p06-route-patch.mjs
      - name: Commit patched route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/institution-analytics/route.ts
          if git diff --cached --quiet; then
            echo "Route already patched."
          else
            git commit -m "Use frozen taxonomy in institution analytics"
            git push origin HEAD:phase1-hardening
          fi

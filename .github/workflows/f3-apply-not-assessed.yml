name: Apply F3 analytics patch
on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/f3-apply-not-assessed.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Apply guarded F3 source patch
        run: python scripts/f3-apply-not-assessed.py
      - name: Verify F3 regression
        run: node scripts/f3-not-assessed-smoke.mjs
      - name: Commit F3 candidate
        run: |
          rm .github/workflows/f3-apply-not-assessed.yml
          rm scripts/f3-apply-not-assessed.py
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add -A
          git diff --cached --quiet || (git commit -m "feat(f3): distinguish unassessed analytics from zero" && git push origin HEAD:phase1-hardening)

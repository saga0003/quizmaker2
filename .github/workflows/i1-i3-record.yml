name: Record I1-I3 verification
on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/i1-i3-record.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Record I1-I3
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('PHASE1_RELEASE_CHECKLIST.md')
          s = p.read_text()
          replacements = {
            '- [ ] I1 `Audit & Health` workspace.': '- [x] I1 `Audit & Health` workspace — verified 2 Sep 2026. The first-class Super Admin workspace now reads authenticated operational evidence from a platform-admin-only health endpoint and presents deployment, database, storage, usage and failure evidence without fabricated uptime claims. Exact candidate `5792cd86edfd579eafd741a2a334f73f5407f9bf` passed complete release gate `33562079269`.',
            '- [ ] I2 Health status: deployment, database, storage, failed imports, failed test starts/saves/submissions.': '- [x] I2 Health status: deployment, database, storage, failed imports, failed test starts/saves/submissions — verified 2 Sep 2026. Live PostgreSQL snapshot reports the measured 24-hour failure window; Vercel production runtime check was clean during acceptance, and the health UI fails visibly rather than inventing operational success.',
            '- [ ] I3 Usage counts computed in PostgreSQL, not by downloading entire tables into application memory.': '- [x] I3 Usage counts computed in PostgreSQL, not by downloading entire tables into application memory — verified 2 Sep 2026. `phase1_platform_health_snapshot()` computes core counts in PostgreSQL; platform-overview totals and per-institution active-student licence usage use exact HEAD counts instead of loading membership rows. The migration is versioned in `supabase/migrations/20260901213000_phase1_platform_health_snapshot.sql` and enforced by the permanent I1-I3 regression.'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing checklist line: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'evidara-hardening-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add PHASE1_RELEASE_CHECKLIST.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(i1-i3): mark platform health verified'
          git push origin HEAD:phase1-hardening

name: Apply student assessment post-submit fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-student-assessment-postsubmit-fix.py'
      - '.github/workflows/apply-student-assessment-postsubmit-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        run: python3 scripts/apply-student-assessment-postsubmit-fix.py

      - name: Verify source contracts
        run: |
          grep -q "orderedOptions.map((option, optionIndex)" src/components/papers/LiveExam.tsx
          grep -q "Your answer" src/components/evidara/post-test-error-classification.tsx
          grep -q "Correct answer" src/components/evidara/post-test-error-classification.tsx
          grep -q "get_live_student_analytics_v12" src/components/analytics-v12/student-analytics-v12.tsx
          git diff --check

      - name: Typecheck
        run: npm run typecheck -- --incremental false

      - name: Commit verified source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/papers/LiveExam.tsx src/components/evidara/post-test-error-classification.tsx src/components/analytics-v12/student-analytics-v12.tsx
          git commit -m "Fix student assessment shuffle reflection and analytics"
          git push origin HEAD:main

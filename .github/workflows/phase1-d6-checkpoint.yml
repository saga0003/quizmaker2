name: Evidara D3-D6 checkpoint recorder

on:
  push:
    branches:
      - phase1-hardening

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Record verified D3-D5 and wire D6
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gate = Path('.github/workflows/phase1-release-gate.yml')
          text = gate.read_text()
          old = """      - name: D6 audience-filter checks\n        run: node scripts/d6-audience-filter-smoke.mjs\n      - name: D7 normalized paper-access checks\n        run: node scripts/d7-normalized-paper-access-smoke.mjs\n"""
          new = """      - name: D4 audience-filter checks\n        run: node scripts/d6-audience-filter-smoke.mjs\n      - name: D6 publish-readiness checks\n        run: node scripts/d6-paper-publish-readiness-smoke.mjs\n      - name: D7 normalized paper-access checks\n        run: node scripts/d7-normalized-paper-access-smoke.mjs\n"""
          if old not in text:
              raise SystemExit('release-gate D6 block did not match expected checkpoint')
          gate.write_text(text.replace(old, new, 1))

          checklist = Path('PHASE1_RELEASE_CHECKLIST.md')
          text = checklist.read_text()
          replacements = {
              "- [ ] D3 Simplified five-step flow: Details → Questions → Audience → Settings → Preview & Publish.": "- [x] **D3 Simplified five-step flow: Details → Questions → Audience → Settings → Preview & Publish** — verified 1 Sep 2026. The paper builder exposes the required five-step guided flow, starts new/edit sessions at Details, keeps Questions and Audience as dedicated stages, embeds the hardened assignment engine against the current paper, keeps Settings in step four and gates final publish/submit actions to Preview & Publish. The permanent 11-point `d3-paper-builder-wizard-smoke.mjs` is wired into the complete release gate; exact candidate `61d08fa5bc8181c5ebe00e21a2b12aa01507b624` passed release-gate run `33456793430` in approximately 2m29s. Permanent production was not promoted.",
              "- [ ] D4 Assignment preview shows exact student count and eligibility warnings before publish.": "- [x] **D4 Assignment preview shows exact student count and eligibility warnings before publish** — verified 1 Sep 2026. Live `preview_paper_assignment_v19` returns the exact eligible active-student count with a separately bounded sample, explicit lifecycle/licence/specific-student/cohort-frozen warnings and blocking severity before materialization; anonymous execution is denied and authenticated access remains permission-scoped. The UI renders those warnings and prevents materialization on blocking findings. The permanent 12-point `d4-assignment-preview-smoke.mjs` plus the related audience-filter regression are release-gated; exact candidate `61d08fa5bc8181c5ebe00e21a2b12aa01507b624` passed run `33456793430`. Permanent production was not promoted.",
              "- [ ] D5 Clone-as-new-version for papers that already have attempts.": "- [x] **D5 Clone-as-new-version for papers that already have attempts** — verified 1 Sep 2026. Live `clone_paper_as_new_version_v1` is a server-side authorized transaction that only clones attempt-bearing papers, serializes lineage/version numbering, creates a fresh draft with new section IDs, preserves frozen question snapshots, clears publication/access/assignment/demo state, deliberately does not copy assignment rows, records audit provenance and denies anonymous execution. The permanent 13-point `d5-paper-clone-version-smoke.mjs` is wired into the complete gate; after correcting a formatting-fragile test assertion, exact candidate `61d08fa5bc8181c5ebe00e21a2b12aa01507b624` passed release-gate run `33456793430`. Permanent production was not promoted."
          }
          for old_line, new_line in replacements.items():
              if old_line not in text:
                  raise SystemExit(f'checklist line missing: {old_line}')
              text = text.replace(old_line, new_line, 1)
          checklist.write_text(text)
          PY
      - name: Commit checkpoint
        shell: bash
        run: |
          rm -f .github/workflows/phase1-d6-checkpoint.yml
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add -A
          git commit -m "chore(d3-d6): record verified D3-D5 and enforce D6 regression"
          git push origin HEAD:phase1-hardening

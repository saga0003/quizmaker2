name: Evidara Phase 1 Release Gate

on:
  push:
    branches:
      - phase1-hardening
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: phase1-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 1 regression gate
        run: npm run qa:final

name: Apply Evidara paper UX fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-paper-audience-sections-fix.py'
      - '.github/workflows/apply-evidara-paper-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply patch
        run: python3 scripts/apply-paper-audience-sections-fix.py

      - name: Verify diff formatting
        run: git diff --check

      - name: Typecheck
        run: npm run typecheck -- --incremental false

      - name: Commit verified source changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/evidara/paper-assignment-center.tsx src/components/evidara/ai-import-helper.tsx src/components/evidara/live-paper-catalogue-v8.tsx
          git commit -m "Fix paper assignment and subject section workflow"
          git push origin HEAD:main

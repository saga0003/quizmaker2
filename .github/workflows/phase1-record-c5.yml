name: Record Phase 1 C5 Verification

on:
  push:
    branches: [phase1-hardening]

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Update checklist and progress log
        shell: python
        run: |
          from pathlib import Path
          checklist = Path('PHASE1_RELEASE_CHECKLIST.md')
          s = checklist.read_text()
          old = '- [ ] C5 Server-side “analytics-ready approval” validation.'
          new = '- [x] **C5 Server-side “analytics-ready approval” validation** — verified 31 Aug 2026. Live migration `phase1_analytics_ready_question_approval` installs a `BEFORE INSERT OR UPDATE` approval guard on `questions` that refuses `approved` state unless content, subject/chapter/topic taxonomy, positive marks, non-negative/capped negative marks and difficulty are present; subject/chapter/topic must be active and hierarchically consistent, and institution-specific taxonomy cannot cross tenant boundaries. The validator is not executable by `anon` or `authenticated`. Production had zero approved questions at cutover, so no approved historical content was invalidated. Dedicated 15-point C5 regression, TypeScript, lint, all required regressions, production build and final gate enforcement passed exact candidate `975f0f90b42cc3ee83bf16d97d46cabc98e5dc5c` in release-gate run `33388303959` (2m 24s). Permanent production web deployment was not promoted.'
          if old not in s and new not in s:
              raise SystemExit('C5 checklist marker missing')
          if old in s:
              checklist.write_text(s.replace(old, new, 1))

          log = Path('PHASE1_PROGRESS_LOG.md')
          l = log.read_text()
          marker = '## 2026-08-31 16:57:54 IST — C5 Analytics-ready question approval'
          if marker not in l:
              l += '''\n\n## 2026-08-31 16:57:54 IST — C5 Analytics-ready question approval\n\n- **Checklist item:** C5 — Server-side analytics-ready approval validation.\n- **Run start:** 2026-08-31 16:57:54 IST.\n- **Implementation start (first relevant commit):** 2026-08-31 17:11:15 IST — `2ab37706a5516ecd277b98d6e03a9b986efa59ce` (`feat(c5): enforce analytics-ready question approval`).\n- **Implementation end (final exact release candidate):** 2026-08-31 17:13:29 IST — `975f0f90b42cc3ee83bf16d97d46cabc98e5dc5c` (`chore(c5): remove one-time gate patch helper`), with permanent C5 release-gate wiring committed immediately before it.\n- **Observable elapsed engineering span:** **2m 14s** from first C5 implementation commit to the exact clean release candidate.\n- **Verification:** GitHub Actions release-gate run `33388303959`, 2026-08-31 17:13:31–17:15:55 IST, duration **2m 24s — PASS**. Dedicated 15-point C5 approval validation, all prior P0/A/B checks, TypeScript, lint, every required regression suite, production build and final gate enforcement passed. Live Supabase verification confirms `trg_question_analytics_ready_v1` is installed on `questions`; `anon` and `authenticated` cannot execute the validator while `service_role` can.\n- **Implementation result:** Questions cannot enter `approved` state unless they have usable content, complete active subject/chapter/topic taxonomy with valid hierarchy, positive marks, valid negative marks and difficulty. Platform questions cannot approve against school-owned taxonomy, and school questions cannot approve against another institution's taxonomy. Production contained zero approved questions at cutover, so the new guard did not invalidate existing approved content.\n- **Rework/failures:** Pre-apply schema inspection caught that `difficulty` is the `question_difficulty` enum, so the initial numeric comparison was corrected before the migration was applied; no invalid live migration was executed. One temporary helper workflow run (`33388234507`) failed because GitHub's workflow token cannot push workflow-file changes without workflow-write permission; the canonical release workflow was then updated through the authorized GitHub connector. Run `33388290956` was subsequently cancelled by normal concurrency after the cleanup commit. The exact final candidate passed cleanly.\n- **Deployment/health:** Production runtime error/fatal logs were clean at run start. The safe database approval guard is live; the permanent Vercel production web deployment was not promoted or altered, and final real-school acceptance remains incomplete.\n- **Next action:** C6 — establish one authoritative correct-answer model and server-enforce consistency between `questions.correct_answer` and option correctness before approval/scoring.\n'''
              log.write_text(l)
      - name: Commit documentation evidence
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          git commit -m "docs(c5): record verified analytics-ready approval"
          git push origin HEAD:phase1-hardening

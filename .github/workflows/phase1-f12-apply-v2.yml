name: Phase 1 F12 apply v2
on:
  push:
    branches: [phase1-hardening]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[f12-apply]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Recreate guarded F12 candidate
        shell: bash
        run: |
          npm install exceljs@4.4.0 --save --save-exact
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/phase1-f12-apply.yml').read_text()
          start = source.index('          cat > src/lib/institutionExcelExport.ts')
          end = source.index('          node scripts/f12-excel-export-smoke.mjs', start)
          block = source[start:end]
          block = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines())
          Path('/tmp/f12-generate.sh').write_text('set -euo pipefail\n' + block + '\n')
          PY
          bash /tmp/f12-generate.sh
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/institution-analytics/institution-analytics-workspace.tsx')
          text = path.read_text()
          old = "      const analytics: AnalyticsV12Payload[] = [];\n      const batchSize = 5;"
          new = "      const analytics: AnalyticsV12Payload[] = [];\n      const client = supabase;\n      const batchSize = 5;"
          if old not in text:
              raise SystemExit('F12 client-narrowing anchor missing')
          text = text.replace(old, new, 1)
          marker = "const results = await Promise.all(batch.map(async (student) => {\n          const { data, error: analyticsError } = await supabase.rpc('get_student_analytics_v12'"
          replacement = "const results = await Promise.all(batch.map(async (student) => {\n          const { data, error: analyticsError } = await client.rpc('get_student_analytics_v12'"
          if marker not in text:
              raise SystemExit('F12 RPC anchor missing')
          path.write_text(text.replace(marker, replacement, 1))
          PY
          node scripts/f12-excel-export-smoke.mjs
          npm run typecheck -- --incremental false
      - name: Commit F12 implementation
        shell: bash
        run: |
          git config user.name 'Evidara Phase 1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json src/lib/institutionExcelExport.ts src/components/institution-analytics/institution-analytics-workspace.tsx scripts/f12-excel-export-smoke.mjs
          git commit -m 'feat(f12): add real Excel analytics workbook [f12-apply]'
          git push

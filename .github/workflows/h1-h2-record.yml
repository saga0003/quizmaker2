name: Record H1 H2 verified checkpoint
on:
  push:
    branches: [phase1-hardening]
    paths:
      - '.github/workflows/h1-h2-record.yml'
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Update checklist and progress log
        run: |
          python - <<'PY'
          from pathlib import Path
          checklist = Path('PHASE1_RELEASE_CHECKLIST.md')
          text = checklist.read_text()
          replacements = {
            "- [ ] H1 Super Admin menu: Command Centre, Institutions, Subscriptions, Analytics, Questions, Papers, Resources, Access & Accounts, Audit & Health, View As.": "- [x] H1 Super Admin menu: Command Centre, Institutions, Subscriptions, Analytics, Questions, Papers, Resources, Access & Accounts, Audit & Health, View As — verified 1 Sep 2026. Phase-1 Super Admin navigation now exposes the required focused menu, preserves the audited read-only View As affordance, and adds a first-class Audit & Health workspace. Exact candidate `cc16ea41de9e4d0491cc99c1936c1740d9c31fcf` passed complete release gate `33524781955`.",
            "- [ ] H2 Hide parked Phase-2 modules from Phase-1 navigation.": "- [x] H2 Hide parked Phase-2 modules from Phase-1 navigation — verified 1 Sep 2026. Products, Referral Settings and Self Assessment are absent from Phase-1 Super Admin navigation while their feature flags remain parked/off; permanent H1/H2 regression is enforced in release gate `33524781955`."
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing checklist line: {old}')
            text = text.replace(old, new, 1)
          checklist.write_text(text)

          log = Path('PHASE1_PROGRESS_LOG.md')
          existing = log.read_text()
          entry = '''\n\n## 2026-09-01 20:55:12 IST — H1/H2 role-focused navigation verified / hourly heartbeat\n\n- **Run start:** 2026-09-01 20:55:12 IST.\n- **Section worked:** H — Role-focused UI/UX.\n- **Starting branch head:** `cc16ea41de9e4d0491cc99c1936c1740d9c31fcf`.\n- **Starting inspection:** Phase 1 checklist/progress branch state, latest GitHub release gate, Vercel production runtime health and Supabase project health were inspected. The repository had already advanced through verified F12, F13 and all of Section G. Vercel production reported no runtime errors in the preceding 24 hours. The connected Supabase projects were ACTIVE_HEALTHY; no database mutation was required for H1/H2.\n- **Checklist items completed:** H1 and H2.\n- **Implementation evidence:** `8ae0bacaba0799162d60b15f24b872b4a6524994` focuses the Phase-1 Super Admin menu and adds Audit & Health; `e7a7c4cbb31faf4f471c2074a6dfee1ff36e87ca` adds the permanent 17-point H1/H2 regression; `cc16ea41de9e4d0491cc99c1936c1740d9c31fcf` wires it into the complete release gate.\n- **CI:** GitHub Actions release gate `33524781955` on exact candidate `cc16ea41de9e4d0491cc99c1936c1740d9c31fcf` — PASS (15:17:05Z to 15:20:05Z, about 3m). TypeScript, lint, all regressions, production build and final gate enforcement passed.\n- **Vercel/Supabase state:** Permanent production remained unchanged and healthy. The head Vercel commit status is constrained by the Hobby-plan build-rate limit, not a runtime/product failure. Supabase remained healthy; H1/H2 required no schema change.\n- **Rework/failures/blockers:** No final functional verification failure. The earlier guarded navigation patch workflow required one workflow correction before the final product/test/gate candidate; the final release gate is green.\n- **Section progress:** H is 2/9 verified (**22.2%**).\n- **Overall Phase 1 progress:** 79/129 verified (**61.2%**) after H1/H2.\n- **Active engineering/review span:** approximately 12 minutes of inspection, reconciliation, health verification and release evidence review in the available execution window; the requested 45–50 minute target was not met because the execution window is shorter, with no idle padding added.\n- **Items still pending:** H3–H9, then I, J, real-school acceptance, load acceptance and production sign-off.\n- **Exact next action:** implement/verify H3 School Admin focused dashboard metrics/actions, then H4 Teacher focus and H5 Student focus; add permanent regression coverage and run the complete release gate before checking those items.\n'''
          if '20:55:12 IST — H1/H2 role-focused navigation verified' not in existing:
            log.write_text(existing + entry)
          PY
      - name: Remove recorder workflow and commit
        run: |
          rm .github/workflows/h1-h2-record.yml
          git config user.name 'Evidara Phase 1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md .github/workflows/h1-h2-record.yml
          git commit -m 'docs(h1-h2): record verified role navigation [skip ci]'
          git push origin HEAD:phase1-hardening

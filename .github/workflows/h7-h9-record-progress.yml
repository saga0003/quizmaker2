name: Record Phase 1 hourly heartbeat

on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/h7-h9-record-progress.yml']

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Append load-runner safety heartbeat once
        shell: bash
        run: |
          if grep -Fq '## 2026-09-02 07:07:19–07:12:11 IST — Load acceptance runner safety hardening' PHASE1_PROGRESS_LOG.md; then
            echo 'Heartbeat already recorded; nothing to do.'
            exit 0
          fi

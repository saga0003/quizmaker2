name: Record Phase 1 hourly heartbeat

on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/h7-h9-record-progress.yml']

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Append acceptance-prep heartbeat once
        shell: bash
        run: |
          if grep -Fq '## 2026-09-02 06:01:10–06:11:22 IST — J3 blocker / real-school and load acceptance preparation' PHASE1_PROGRESS_LOG.md; then
            echo 'Heartbeat already recorded; nothing to do.'
            exit 0
          fi
          cat >> PHASE1_PROGRESS_LOG.md <<'EOF'


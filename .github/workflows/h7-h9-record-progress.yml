name: Record Phase 1 hourly heartbeat

on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .phase1-heartbeat-trigger.b64

permissions:
  contents: write

concurrency:
  group: phase1-heartbeat-recorder
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0

      - name: Decode and append heartbeat once
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .phase1-heartbeat-trigger.b64 > /tmp/phase1-heartbeat.md
          marker="$(head -n 1 /tmp/phase1-heartbeat.md)"
          test -n "$marker"
          if grep -Fqx "$marker" PHASE1_PROGRESS_LOG.md; then
            echo "Heartbeat already recorded: $marker"
            exit 0
          fi
          printf '\n' >> PHASE1_PROGRESS_LOG.md
          cat /tmp/phase1-heartbeat.md >> PHASE1_PROGRESS_LOG.md
          printf '\n' >> PHASE1_PROGRESS_LOG.md

      - name: Commit progress log if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- PHASE1_PROGRESS_LOG.md; then
            echo 'No progress-log change required.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PHASE1_PROGRESS_LOG.md
          git commit -m "docs: append Phase 1 hourly heartbeat [skip ci]"
          git push origin HEAD:phase1-hardening

name: A10 one-time source patch

on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/a10-one-time-source-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Scope paper autosave namespace by tenant
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/components/evidara/live-paper-catalogue-v8.tsx')
          source = path.read_text()
          old = "const draftBase = useMemo(() => `evidara-v8-paper:${user?.id || 'anonymous'}:${kind}`, [kind, user?.id]);"
          new = "const draftScope = kind === 'admin' ? 'platform' : organizationId || 'no-institution';\nconst draftBase = useMemo(() => `evidara-v8-paper:${user?.id || 'anonymous'}:${kind}:${draftScope}`, [draftScope, kind, user?.id]);"
          if old not in source:
              raise SystemExit('Expected pre-A10 draft namespace was not found; refusing an ambiguous patch.')
          path.write_text(source.replace(old, new, 1))
      - name: Commit scoped autosave source
        shell: bash
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/evidara/live-paper-catalogue-v8.tsx
          git diff --cached --check
          git commit -m "feat(a10): scope paper autosave keys by institution"
          git push origin HEAD:phase1-hardening

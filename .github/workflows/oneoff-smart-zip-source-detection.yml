name: One-off smart ZIP source detection

on:
  push:
    branches:
      - fix/zip-smart-source-detection-2026-09-21
    paths:
      - .github/workflows/oneoff-smart-zip-source-detection.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/zip-smart-source-detection-2026-09-21
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply smart ZIP source detection
        run: python scripts/apply-smart-zip-source-detection.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -- --incremental false

      - name: Lint
        run: npm run lint

      - name: Import regression smoke
        run: npm run qa:v19-1

      - name: Production build
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "Evidara Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/oneoff-smart-zip-source-detection.yml scripts/apply-smart-zip-source-detection.py
          git add src/components/evidara/question-bulk-import-dialog-core.tsx scripts/v19-1-latex-paper-import-smoke.mjs
          git commit -m "fix: make ZIP import choose the real question paper automatically [smart-zip-source]"
          git push origin HEAD:fix/zip-smart-source-detection-2026-09-21

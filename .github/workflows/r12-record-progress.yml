name: R12 Record Progress

on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/r12-record-progress.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Record verified R12 acceptance and hourly heartbeat
        shell: python
        run: |
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          checklist = Path('PHASE1_RELEASE_CHECKLIST.md')
          text = checklist.read_text()
          old = '- [ ] R12 Verify held/released result modes.'
          new = '- [x] R12 Verify held/released result modes — verified 3 Sep 2026 using only the isolated synthetic `Evidara School` (`evidara-school-acceptance`) tenant. Held mode passed rendered acceptance workflow `33705794097` (attempt 3): the server reported release level `none`, authoritative score/count fields were withheld, the Student UI rendered the explicit held-result state, and answers/reflection were not exposed. The synthetic paper was then restored to `score_only`; rendered score-only workflow `33727428759` (attempt 2) passed and displayed authoritative `8/80` and `10%` without the held state or reflection, while the server contract reported release level `score`, `answers_released=false` and `analytics_released=false`. Independent Supabase reconciliation confirmed paper `e5801a88-1e7f-4b4f-a715-ad44ce2b3c43` remains `score_only` and submitted attempt `134ddbe2-bc9f-4863-9aba-3b9def08d69e` is `8/80`, `10%`, `2 correct`, `0 incorrect`, `18 unanswered`. Exact R12 workflow candidate `0765c30d5efbdbe49267f2368219b81742d819d4` passed complete Phase 1 release gate `33727428783`; permanent production remained protected.'
          if old not in text:
              raise SystemExit('Unchecked R12 checklist line not found; refusing duplicate or ambiguous record')
          updated = text.replace(old, new, 1)
          checklist.write_text(updated)

          checked = sum(1 for line in updated.splitlines() if line.startswith('- [x]'))
          unchecked = sum(1 for line in updated.splitlines() if line.startswith('- [ ]'))
          total = checked + unchecked
          r_checked = sum(1 for line in updated.splitlines() if line.startswith('- [x] R'))
          r_total = sum(1 for line in updated.splitlines() if line.startswith('- [x] R') or line.startswith('- [ ] R'))
          end = datetime.now(ZoneInfo('Asia/Kolkata')).strftime('%Y-%m-%d %H:%M:%S IST')
          heartbeat = f'''\n## 2026-09-03 15:47 IST — R12 held/released result modes verified\n\n- **Checklist item:** R12 — Verify held/released result modes.\n- **Run start:** 2026-09-03 15:47 IST.\n- **Run end/record time:** {end}.\n- **Acceptance evidence:** Held-result workflow `33705794097` attempt 3 — **PASS**. Score-only workflow `33727428759` attempt 2 — **PASS**.\n- **Independent Supabase reconciliation:** isolated tenant `evidara-school-acceptance`; acceptance paper remains `score_only`; submitted attempt `134ddbe2-bc9f-4863-9aba-3b9def08d69e` = `8/80`, `10%`, `2 correct`, `0 incorrect`, `18 unanswered`. No St. Mary's or future-client data used.\n- **Complete release gate:** `33727428783` on exact R12 workflow candidate `0765c30d5efbdbe49267f2368219b81742d819d4` — **PASS**.\n- **Deployment/health:** Vercel production 24h runtime-error check clean; permanent production unchanged/protected. Supabase `SMIS QP` `ACTIVE_HEALTHY`.\n- **Automation:** hourly `Evidara Phase 1 Hardening` schedule re-enabled after protected-preview credential refresh.\n- **Progress after R12:** acceptance R = {r_checked}/{r_total}; overall checklist = {checked}/{total} ({(100*checked/total):.1f}%).\n- **Rework/blockers:** protected-preview credential drift was resolved by refreshing `EVIDARA_ACCEPTANCE_VERCEL_SHARE_URL`; no security protection was weakened.\n- **Exact next action:** R13 — release analytics only on the isolated synthetic paper in a controlled acceptance step, verify rendered Student subject/chapter/topic/question analytics against authoritative Supabase evidence, restore the intended safe paper state, then run the complete release gate before checking R13.\n'''
          with Path('PHASE1_PROGRESS_LOG.md').open('a', encoding='utf-8') as f:
              f.write(heartbeat)
      - name: Commit R12 acceptance record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          git commit -m 'docs: record verified R12 acceptance'
          git push origin HEAD:phase1-hardening

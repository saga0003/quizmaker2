name: Phase 1 F8-F11 recorder
on:
  push:
    branches: [phase1-hardening]
permissions:
  contents: write
jobs:
  record:
    if: ${{ !contains(github.event.head_commit.message, '[f8-f11-recorder]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Record verified F8-F11 and heartbeat
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          checklist = Path('PHASE1_RELEASE_CHECKLIST.md')
          text = checklist.read_text()
          replacements = {
            '- [ ] F8 School → programme → grade → section → subject → chapter → topic → student drilldown.': '- [x] F8 School → programme → grade → section → subject → chapter → topic → student drilldown — verified 1 Sep 2026 on release-gate run `33518782850`; the canonical roster `tracks` field supplies programme identity, programme/grade/section are first-class API/UI levels, and the permanent F8 hierarchy regression passes inside the complete gate.',
            '- [ ] F9 Teacher `Needs Attention` dashboard with actionable evidence rather than chart overload.': '- [x] F9 Teacher `Needs Attention` dashboard with actionable evidence rather than chart overload — verified 1 Sep 2026 on release-gate run `33518782850`; the teacher-only queue is section-scoped, evidence-first, bounded, preserves not-assessed states and avoids predictive/judgement claims.',
            '- [ ] F10 Raw question-response evidence remains auditable and correctly scoped.': '- [x] F10 Raw question-response evidence remains auditable and correctly scoped — verified 1 Sep 2026 on release-gate run `33518782850`; RLS remains enabled, anonymous/DML browser access is revoked, student reads are self-only, and teacher reads bind frozen section plus exact paper subject/question scope.',
            '- [ ] F11 Traditional result sheet with rank/score/accuracy/time.': '- [x] F11 Traditional result sheet with rank/score/accuracy/time — verified 1 Sep 2026 on exact candidate `64683beed8dffbe2470c70b4bf1baf9661247b27`, release-gate run `33518782850`; submitted-attempt ranking, score, answered-denominator accuracy, authoritative timing and equal-score rank semantics are permanently regression-tested.',
          }
          for old,new in replacements.items():
            if old in text:
              text = text.replace(old,new)
            elif new not in text:
              raise SystemExit(f'Missing checklist line: {old}')
          checklist.write_text(text)

          log = Path('PHASE1_PROGRESS_LOG.md')
          entry = '''\n\n## 2026-09-01 19:54:33 IST — F8–F11 verification reconciliation / hourly heartbeat\n\n- **Run start/end:** 2026-09-01 19:54:33 IST → approximately 20:10 IST.\n- **Active engineering/review span:** approximately **15 minutes** of repository-state reconciliation, release-gate inspection, regression review and checklist/log repair in the available execution window. The requested 45–50 minute target was **not met because this runtime window ended materially earlier**; no idle padding was added.\n- **Section worked:** F — Results and analytics.\n- **Checklist items completed:** F8, F9, F10 and F11.\n- **Items still pending:** F12 and F13.\n- **Starting branch head:** `64683beed8dffbe2470c70b4bf1baf9661247b27`.\n- **Commits created:** this recorder commit only; F8–F11 product/gate commits were already present on the branch and were reconciled rather than reimplemented.\n- **CI:** complete Phase-1 release gate `33518782850` on exact candidate `64683beed8dffbe2470c70b4bf1baf9661247b27` — **PASS**, 2026-09-01 19:49:29–19:51:35 IST (~2m06s). Gate includes permanent F8 hierarchy, F9 teacher attention, F10 raw evidence scope and F11 traditional result-sheet checks, plus TypeScript, lint, all prior regressions and production build.\n- **Vercel:** current commit status reports only the known Hobby preview build-rate-limit condition; no production promotion was attempted. Permanent production remains protected pending the remaining checklist and acceptance gates.\n- **Supabase:** no database mutation was performed in this reconciliation run. F10's scoped raw-evidence migration is represented in the green release candidate; live-state revalidation remains part of subsequent acceptance before production sign-off.\n- **Rework/failures/blockers:** the prior F8 heartbeat recorder had failed before creating a job, leaving verified work unrecorded. This run repaired that documentation gap. No product-code rework was required for F8–F11 because the exact F11 candidate already passed the complete gate.\n- **Section F progress:** 11/13 verified = **84.6%**.\n- **Overall Phase 1:** 69/129 verified = **53.5%**.\n- **Exact next action:** F12 — implement a true Excel workbook export for test results plus student×subject/chapter/topic analytics (not CSV-only), add a permanent F12 regression, wire it into the release gate, run the complete gate, then continue directly to F13 if green.\n'''
          existing = log.read_text()
          if '## 2026-09-01 19:54:33 IST — F8–F11 verification reconciliation / hourly heartbeat' not in existing:
            log.write_text(existing.rstrip() + entry + '\n')
          PY
          git config user.name 'Evidara Phase 1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          git commit -m 'docs: record verified F8-F11 [f8-f11-recorder]' || exit 0
          git push

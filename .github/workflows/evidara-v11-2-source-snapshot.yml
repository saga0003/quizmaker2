name: Apply Evidara V11.2 Hardening

on:
  push:
    branches:
      - evidara-v11-clean-baseline
    paths:
      - .github/v11-2-patch/READY

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      EXPECTED_PATCH_SHA256: 88371983b4f299e29d64a79a82ce89528b3e95527d7f69a2f875a1d2cb9095d9
    steps:
      - name: Check out V11 branch
        uses: actions/checkout@v4
        with:
          ref: evidara-v11-clean-baseline
          fetch-depth: 0

      - name: Report hardening run
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- evidara-v11-2-source-snapshot -->';
            const body = `${marker}\nV11.2 hardening validation run: ${context.runId}\nSource commit: ${context.sha}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 30,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 30, body });
            }

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v11-2-patch/part-* | base64 --decode > /tmp/evidara-v11-2.patch.xz
          xz --decompress --stdout /tmp/evidara-v11-2.patch.xz > /tmp/evidara-v11-2.patch
          echo "${EXPECTED_PATCH_SHA256}  /tmp/evidara-v11-2.patch" | sha256sum --check --strict
          git apply --check --whitespace=error-all /tmp/evidara-v11-2.patch
          git apply --whitespace=error-all /tmp/evidara-v11-2.patch
          rm -rf .github/v11-2-patch
          rm -f .github/workflows/evidara-v11-2-source-snapshot.yml
          git diff --check

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run complete V11.2 quality gate
        run: npm run qa

      - name: Commit validated V11.2 baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Evidara V11.2 baseline"
          git push origin HEAD:evidara-v11-clean-baseline

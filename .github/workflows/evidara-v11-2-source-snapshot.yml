name: Evidara V11.2 Source Snapshot

on:
  push:
    branches:
      - evidara-v11-clean-baseline
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Evidara V11.2 worktree
        uses: actions/checkout@v4
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: evidara-v11-2-source-${{ github.sha }}
          path: |
            .
            !.git/**
            !node_modules/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Report snapshot run
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- evidara-v11-2-source-snapshot -->';
            const body = `${marker}\nV11.2 source snapshot run: ${context.runId}\nCommit: ${context.sha}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 30,
              per_page: 100,
            });
            const previous = comments.find((comment) => comment.body?.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 30,
                body,
              });
            }

name: Phase 1 R6 Record Once

on:
  push:
    branches: [phase1-hardening]
    paths:
      - .github/workflows/phase1-r6-record-once.yml

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Record verified R6 and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('PHASE1_RELEASE_CHECKLIST.md')
          s=p.read_text(encoding='utf-8')
          old='- [ ] R6 Import at least 500 questions and resolve invalid rows.'
          new='- [x] R6 Import at least 500 questions and resolve invalid rows — verified 2 Sep 2026 in the isolated synthetic `Evidara School` acceptance tenant. Canonical `bulk_import_questions_v71` imported 500 unique synthetic questions from a 502-row batch, isolated invalid row 501 (`22P02`) and exact duplicate row 502 (`23505`) without aborting valid rows, and recorded batch `a69979b8-fee5-46da-b39c-52e47a1fdc7b` as `completed_with_errors` with 500 imported / 2 failed. School Admin import parity and deferred duplicate/correct-answer row isolation are versioned in `supabase/migrations/20260902215500_phase1_r6_question_import_hardening.sql`; exact functional commit `e2259896935e80b7f4d4811ec6663e00b3793262` passed the complete release gate.'
          if s.count(old)!=1:
              raise SystemExit(f'guard failed: expected exactly one unchecked R6 line, found {s.count(old)}')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          rm .github/workflows/phase1-r6-record-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE1_RELEASE_CHECKLIST.md .github/workflows/phase1-r6-record-once.yml
          git commit -m 'docs(phase1): record verified R6 acceptance'
          git push origin HEAD:phase1-hardening

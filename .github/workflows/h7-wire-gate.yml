name: Wire H7 Release Gate

on:
  push:
    branches: [phase1-hardening]

permissions:
  contents: write

jobs:
  wire:
    if: contains(github.event.head_commit.message, 'wire H7 release gate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Wire permanent H7 regression
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/phase1-release-gate.yml')
          s = p.read_text()
          needle = "      - name: H6 UI consistency checks\n        run: node scripts/h6-ui-consistency-smoke.mjs\n"
          addition = needle + "      - name: H7 responsive contract checks\n        run: node scripts/h7-responsive-contract-smoke.mjs\n"
          if 'H7 responsive contract checks' not in s:
              if needle not in s:
                  raise SystemExit('H6 insertion anchor not found')
              s = s.replace(needle, addition, 1)
              p.write_text(s)
      - name: Commit gate wiring
        shell: bash
        run: |
          git config user.name "evidara-phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/phase1-release-gate.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci(h7): enforce responsive contract regression [skip ci]"
          git push origin HEAD:phase1-hardening

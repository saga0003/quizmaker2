name: Record current hardening heartbeat
on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/c7-record-progress.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Append I1-I3 heartbeat
        shell: bash
        run: |
          if grep -q 'I1–I3 Super Admin platform health (verified)' PHASE1_PROGRESS_LOG.md; then
            echo 'Heartbeat already recorded.'
            exit 0
          fi
          cat >> PHASE1_PROGRESS_LOG.md <<'EOF'


name: Apply F6 measured class leaderboard
on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/c7-record-progress.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Apply F6 product and regression changes
        shell: python {0}
        run: |
          from pathlib import Path

          source_path = Path('src/components/institution-analytics/institution-analytics-workspace.tsx')
          source = source_path.read_text()

          old = """  const { classRow, students, allStudents, subjects, bands, search, setSearch, filter, setFilter, sort, onSort, selected, setSelected, allVisibleSelected, toggleAll, onSubject, onStudent, onDownloadReports, onDownloadCsv } = props;\n  return <>"""
          new = """  const { classRow, students, allStudents, subjects, bands, search, setSearch, filter, setFilter, sort, onSort, selected, setSelected, allVisibleSelected, toggleAll, onSubject, onStudent, onDownloadReports, onDownloadCsv } = props;\n  const leaderboard = allStudents\n    .filter((row) => row.averagePercentage !== null)\n    .sort((a, b) => a.rank - b.rank)\n    .slice(0, 5);\n  return <>"""
          if old not in source:
            raise SystemExit('F6 ClassView anchor not found')
          source = source.replace(old, new, 1)

          anchor = '''    <section className="institution-section"><div className="institution-section-heading report-heading"><div><h2>Student performance</h2><p>Filter, select specific students, then download report cards or the results sheet.</p></div><div><Button variant="outline" onClick={onDownloadCsv} disabled={!students.length}><FileDown />Download CSV</Button><Button onClick={onDownloadReports} disabled={!selected.size}><Download />Report cards ({selected.size})</Button></div></div>'''
          leaderboard_block = '''    <section className="institution-section institution-leaderboard-section"><div className="institution-section-heading"><div><h2>Class leaderboard</h2><p>Ranked only from submitted assessment percentages. Students without measured evidence are excluded.</p></div><Badge variant="outline">{leaderboard.length} assessed</Badge></div>
      {leaderboard.length ? <div className="institution-leaderboard">{leaderboard.map((row) => <article key={row.id} className="institution-leaderboard-card">
        <span className={`institution-rank rank-${Math.min(row.rank, 3)}`}>{row.rank}</span>
        <div><strong>{row.name}</strong><small>{row.completedTests} submitted test{row.completedTests === 1 ? '' : 's'} · {percentage(row.accuracy)} accuracy</small></div>
        <b style={{ color: metricTone(row.averagePercentage) }}>{percentage(row.averagePercentage)}</b>
        <button type="button" onClick={() => onStudent(row)}>Click to Analyse <ChevronRight /></button>
      </article>)}</div> : <InstitutionEmptyState title="Leaderboard awaiting evidence" copy="Ranks will appear after students submit measured assessments. No synthetic or placeholder scores are used." />}
    </section>
''' + anchor
          if anchor not in source:
            raise SystemExit('F6 student-performance anchor not found')
          source = source.replace(anchor, leaderboard_block, 1)

          old_action = '''<TableCell><button type="button" onClick={() => onStudent(row)} className="institution-row-arrow"><ChevronRight /></button></TableCell>'''
          new_action = '''<TableCell><button type="button" onClick={() => onStudent(row)} className="institution-analyse-button">Click to Analyse <ChevronRight /></button></TableCell>'''
          if old_action not in source:
            raise SystemExit('F6 student row action anchor not found')
          source = source.replace(old_action, new_action, 1)
          source_path.write_text(source)

          css_path = Path('src/components/institution-analytics/institution-analytics.css')
          css = css_path.read_text()
          marker = '/* F6 measured class leaderboard */'
          if marker not in css:
            css += '''\n/* F6 measured class leaderboard */
          .institution-leaderboard-section{margin-top:18px}
          .institution-leaderboard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
          .institution-leaderboard-card{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;min-width:0}
          .institution-leaderboard-card>div{min-width:0}.institution-leaderboard-card>div strong,.institution-leaderboard-card>div small{display:block}.institution-leaderboard-card>div strong{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.institution-leaderboard-card>div small{margin-top:3px;color:var(--muted-foreground);font-size:9px;line-height:1.4}
          .institution-leaderboard-card>b{grid-column:1/3;font-size:20px}.institution-leaderboard-card>button,.institution-analyse-button{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;color:var(--teal);font-size:10px;font-weight:700;cursor:pointer}.institution-leaderboard-card>button{grid-column:1/3;justify-content:flex-start;padding:2px 0}.institution-leaderboard-card>button svg,.institution-analyse-button svg{width:13px;height:13px}
          .institution-analyse-button{white-space:nowrap}
          @media(max-width:1100px){.institution-leaderboard{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:640px){.institution-leaderboard{grid-template-columns:1fr}}
          '''
            css_path.write_text(css)

          smoke = r'''import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const ui = fs.readFileSync('src/components/institution-analytics/institution-analytics-workspace.tsx', 'utf8');
          const api = fs.readFileSync('src/app/api/institution-analytics/route.ts', 'utf8');
          const css = fs.readFileSync('src/components/institution-analytics/institution-analytics.css', 'utf8');

          const checks = [
            ['student rank is derived after sorting by measured average percentage', api.includes(".sort((a, b) => (b.averagePercentage ?? -1) - (a.averagePercentage ?? -1)).map((row, index) => ({ ...row, rank: index + 1 }))")],
            ['student average percentage derives only from submitted attempts', api.includes(".eq('status', 'submitted')") && api.includes('averagePercentage: average(percentages)')],
            ['leaderboard excludes students without measured score evidence', ui.includes('.filter((row) => row.averagePercentage !== null)')],
            ['leaderboard preserves backend measured rank order', ui.includes('.sort((a, b) => a.rank - b.rank)')],
            ['leaderboard is bounded to five students', ui.includes('.slice(0, 5);')],
            ['leaderboard explains measured-evidence ranking', ui.includes('Ranked only from submitted assessment percentages. Students without measured evidence are excluded.')],
            ['leaderboard shows score, accuracy and submitted-test evidence', ui.includes("{percentage(row.averagePercentage)}") && ui.includes("{percentage(row.accuracy)} accuracy") && ui.includes("{row.completedTests} submitted test")],
            ['leaderboard has explicit Click to Analyse action', ui.includes('Click to Analyse <ChevronRight />')],
            ['student table has explicit Click to Analyse action', ui.includes('className="institution-analyse-button">Click to Analyse <ChevronRight />')],
            ['empty leaderboard refuses synthetic scores', ui.includes('No synthetic or placeholder scores are used.')],
            ['leaderboard layout is responsive', css.includes('/* F6 measured class leaderboard */') && css.includes('@media(max-width:640px){.institution-leaderboard{grid-template-columns:1fr}}')],
          ];
          let passed = 0;
          for (const [name, ok] of checks) {
            assert.ok(ok, `F6 check failed: ${name}`);
            console.log(`PASS: ${name}`);
            passed += 1;
          }
          console.log(`F6 measured class leaderboard checks passed: ${passed}/${checks.length}`);
          '''
          Path('scripts/f6-measured-class-leaderboard-smoke.mjs').write_text(smoke)
      - name: Run F6 smoke
        run: node scripts/f6-measured-class-leaderboard-smoke.mjs
      - name: Commit F6 implementation
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add src/components/institution-analytics/institution-analytics-workspace.tsx src/components/institution-analytics/institution-analytics.css scripts/f6-measured-class-leaderboard-smoke.mjs
          git diff --cached --quiet || (git commit -m "feat(f6): add measured class leaderboard actions" && git push origin HEAD:phase1-hardening)

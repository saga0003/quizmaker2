name: Record R1-R5 acceptance
on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/c7-record-progress.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Record acceptance
        run: node scripts/phase1-record-r1-r5-once.mjs
      - name: Commit record and cleanup
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          rm scripts/phase1-record-r1-r5-once.mjs
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md scripts/phase1-record-r1-r5-once.mjs
          git commit -m "docs(acceptance): verify R1-R5 and record hourly progress"
          git push origin HEAD:phase1-hardening

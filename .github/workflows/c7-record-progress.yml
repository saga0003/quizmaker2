name: Record F3 F4 verified progress
on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/c7-record-progress.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Mark verified F3 F4 checklist items
        shell: python {0}
        run: |
          from pathlib import Path
          p=Path('PHASE1_RELEASE_CHECKLIST.md')
          s=p.read_text()
          s=s.replace('- [ ] F3 `No data` displays as `— / Not assessed`, never misleading 0%.','- [x] **F3 No-data analytics semantics** — verified 1 Sep 2026. Missing analytics denominators remain null and render `— / Not assessed` rather than false `0%`, while genuine measured zero remains `0%`. Permanent 15-point `f3-not-assessed-smoke.mjs` is enforced in the release gate; F3 source commit `1bca668e2580dea00c6773b9528b9bca506f6a1d` is contained in descendant complete release-gate run `33493732256`, which passed.',1)
          s=s.replace('- [ ] F4 Student hierarchy: Overview → Subject → Chapter → Topic → Question Evidence.','- [x] **F4 Student hierarchy through Question Evidence** — verified 1 Sep 2026. The live institution student detail supports Overview/Subject → Chapter → Topic → Question Evidence using the already-authorized `question_evidence` payload. Exact-topic question rows show assessment/question identity, question text, Correct/Incorrect/Unanswered outcome, awarded marks and recorded time; empty evidence does not synthesize rows. Product commit `e60943eccbb87b1af4b5c3e76946ca797733dda2`; permanent 13-point F4 regression; final candidate `f4cb93a8ce3b34d6a26ac09b7422012f0c65d22a` passed complete release gate `33498871986` in about 2m29s after stale legacy assertions were aligned to the new evidence contract.',1)
          p.write_text(s)
      - name: Commit checklist correction
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add PHASE1_RELEASE_CHECKLIST.md
          git diff --cached --quiet || (git commit -m "docs(f4): mark F3 F4 verified" && git push origin HEAD:phase1-hardening)

name: Apply canonical F6 F7 analytics thresholds
on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/c7-record-progress.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Align canonical patch anchor
        run: sed -i "s/#9cabb7/#94A3B8/g" scripts/f6-f7-canonical-apply.py
      - name: Apply canonical F6 F7 patch
        run: python scripts/f6-f7-canonical-apply.py
      - name: Run canonical F6 smoke
        run: node scripts/f6-topic-evidence-threshold-smoke.mjs
      - name: Run canonical F7 smoke
        run: node scripts/f7-percentile-cohort-smoke.mjs
      - name: Commit canonical H7 H8 H9 record
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git rm -f scripts/f6-f7-canonical-apply.py
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          git commit -m "docs: record H7-H9 verification"
          git push origin HEAD:phase1-hardening
# canonical recorder retry after checklist-token correction

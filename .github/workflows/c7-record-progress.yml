name: Record D6 D7 verification and Section E handoff
on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/c7-record-progress.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Record D6 D7 verification and heartbeat
        shell: python {0}
        run: |
          from pathlib import Path
          import re, subprocess
          checklist_path=Path('PHASE1_RELEASE_CHECKLIST.md')
          checklist=checklist_path.read_text()
          replacements={
            '- [ ] D6 Publish checklist validates approved questions, duration, marks, audience, schedule and result policy.': '- [x] **D6 Publish preflight checklist** — verified 1 Sep 2026. Preview & Publish performs a server-authoritative `get_paper_publish_readiness_v1` check across approved questions, duration, marks, audience, schedule and result policy. A successful check is bound to the exact current paper fingerprint, so subsequent edits invalidate readiness and publishing remains locked until rechecked. Permanent D6 regression is release-gated; the D7 exact candidate also passed D6 in complete release-gate run `33467033418`. Permanent production was not promoted.',
            '- [ ] D7 Test Results / Analytics / Export are first-class actions on a paper.': '- [x] **D7 First-class paper actions** — verified 1 Sep 2026. Paper rows now expose real Edit, Preview, Duplicate, Test Results, Analytics, Export and Archive actions. Preview hydrates the exact saved paper into the learner view; Results/Analytics/CSV Export read the RLS-scoped `exam_attempts` evidence for that paper with a 500-row bound. Live `exam_attempts` SELECT RLS allows the student themself or an authorized paper manager. Permanent `d7-paper-card-actions-smoke.mjs` is wired into every release gate. After updating two formatting/label-coupled legacy regressions, exact engineering candidate `9347cdcb17350e959f2c340c07ed4bc6e6fcbae5` passed complete release-gate run `33467033418` from 09:10:06–09:12:14 IST (2m08s), including D3–D7, TypeScript, lint, all regressions, production build and final enforcement. Temporary patch machinery was removed after the green gate. Permanent production was not promoted.'
          }
          for old,new in replacements.items():
            if old in checklist:
              checklist=checklist.replace(old,new,1)
            elif new not in checklist:
              raise SystemExit(f'Checklist marker not found: {old}')
          checklist_path.write_text(checklist)

          log=Path('PHASE1_PROGRESS_LOG.md'); body=log.read_text()
          marker='## 2026-09-01 09:02:05 IST — D6/D7 verified; Section D closed / hourly heartbeat'
          updated=checklist_path.read_text(); items=re.findall(r'^- \[([ x])\]',updated,re.M); done=sum(v=='x' for v in items); total=len(items)
          dm=re.search(r'^# D —.*?(?=^# E —)',updated,re.M|re.S); di=re.findall(r'^- \[([ x])\]',dm.group(0),re.M) if dm else []; dd=sum(v=='x' for v in di)
          em=re.search(r'^# E —.*?(?=^# F —)',updated,re.M|re.S); ei=re.findall(r'^- \[([ x])\]',em.group(0),re.M) if em else []; ed=sum(v=='x' for v in ei)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          entry=f'''\n\n{marker}\n\n- **Run start/end:** 2026-09-01 09:02:05 IST → approximately 09:14 IST.\n- **Active engineering/review span:** approximately **12 minutes** in the available execution window; the requested 45–50 minute target was not reached because the runtime window ended earlier. No idle padding was added.\n- **Section worked:** D — Paper, assignment and test creation; Section E handoff started.\n- **Checklist items completed this run:** D6 and D7 formally verified/recorded; Section D is complete.\n- **Items still pending in active section:** Section E has E6 idempotent submission/receipt, E7 integrity evidence wording/report, E8 load acceptance; E1–E5 were already verified.\n- **Branch head at heartbeat source:** `{{head}}`.\n- **Commits created this run:** temporary patch/setup commits `32fe4f06c2376efd49967051cad7650f2929650a`, `0bc72512ad495148898934df9418f23c748f3048`, `84bead80cf77ae742aeb92d91e841d18d5ca8357`, `0989eaae02c5047466b82f1ec6c15765f957bc7c`, `e240bee46cf6ef011f5ebaae63de7aaebfbdd7a6`; implementation `346b9f20e6182a1582bc07fa67782b7588d74517`; permanent gate wiring `71257dd0c0082e117109f76b5db4d5c99ad90f8c`; regression rework `21e7f35bcf57d0f55a13ee14fe3c219d9d3952c8`, `9347cdcb17350e959f2c340c07ed4bc6e6fcbae5`; cleanup `33e4914f8ad29cdb873ae2386d2c81ea215264ed`, `9f5adcc9286167d6d2ec4e6e2301acec86ac202d`, `621061edcea0d24ddcf05595d875798d81ba0094`.\n- **CI:** initial D7 gate `33466889989` stopped at a D3 wording-coupled regression; replacement gate `33466975296` then stopped at a D5 label-coupled regression. Both were corrected without weakening product requirements. Exact engineering candidate `9347cdcb17350e959f2c340c07ed4bc6e6fcbae5` passed complete release gate `33467033418` in **2m08s** with D3–D7, TypeScript, lint, all legacy regressions, production build and final enforcement green. Cleanup/doc pushes may supersede with newer gates, but contain no product behavior changes.\n- **Vercel:** connected team/project discovery succeeded, but deployment-list verification returned `404 Project not found` for the connector project ID during this run. The repository's built-in Vercel regression passed in the complete gate. No deployment or production promotion was attempted; permanent production remains protected.\n- **Supabase:** project `xzfozpnzvznqrvcsoail` remained `ACTIVE_HEALTHY`; live state remained **3 papers / 0 published**. `exam_attempts` SELECT RLS permits only the owning student or a manager authorized through `is_paper_manager(p.organization_id)`, matching the D7 result/analytics/export query. No database mutation was required for D7.\n- **Rework/failures/blockers:** first temporary D7 patch workflow `33466806062` applied the source transform but failed only during bot commit; narrowing commit scope fixed it in retry `33466852214`. Two subsequent release gates exposed brittle old D3/D5 source-string assumptions caused by the new safe Preview return value and user-facing `Duplicate paper` label; those regressions were updated to test the actual contracts. Vercel deployment-list API remains a verification limitation, not a product blocker.\n- **Section progress:** D has {{dd}}/{{len(di)}} verified items (**{{(100*dd/len(di) if di else 0):.1f}}%**). Section E is {{ed}}/{{len(ei)}} (**{{(100*ed/len(ei) if ei else 0):.1f}}%**) at handoff.\n- **Overall Phase 1 percentage:** {{done}}/{{total}} checklist items verified (**{{(100*done/total if total else 0):.1f}}%**).\n- **Target status:** 45–50 minute productive target **not met** because the automation execution window available for this block was materially shorter; limitation recorded explicitly.\n- **Exact next action:** resume E6 by inspecting and hardening `submit_exam_attempt` for replay-safe/idempotent final submission and a durable server-confirmed submission receipt; add permanent E6 regression, live-verify Supabase concurrency/replay behavior, run the complete release gate, then continue immediately to E7 and E8.\n'''
          if marker not in body:
            log.write_text(body.rstrip()+entry)
      - name: Commit verification record
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          git diff --cached --quiet || (git commit -m "docs(d7): verify paper actions and close Section D" && git push origin HEAD:phase1-hardening)

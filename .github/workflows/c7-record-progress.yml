name: Record C8 verification and hourly heartbeat

on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/c7-record-progress.yml']

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Record verified C8 and heartbeat
        shell: python
        run: |
          from pathlib import Path

          checklist = Path('PHASE1_RELEASE_CHECKLIST.md')
          text = checklist.read_text()
          old = '- [ ] C8 School Admin archive policy; permanent delete only for unused mistaken records.'
          new = '- [x] **C8 School Admin archive/delete retention policy** — verified 31 Aug 2026. Live migration `phase1_question_retention_policy` requires School Admin (or Super Admin) authority to archive institution questions and Super Admin authority to archive platform questions. Permanent deletion is limited to unused `draft`/`rejected` mistakes, and questions referenced by a paper are retained; `phase1_question_retention_lookup_index` indexes the paper-usage guard. Dedicated 15-point `c8-question-retention-smoke.mjs`, all prior hardening checks, TypeScript, lint, every required regression suite, production build and final gate enforcement passed exact candidate `bd19e5f07fac4a025da8be9ebfd05329752651c4` in release-gate run `33410259941` (1m 54s); matching Vercel preview is READY. Permanent production was not promoted.'
          if old in text:
              checklist.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Expected C8 checklist line not found')

          log = Path('PHASE1_PROGRESS_LOG.md')
          body = log.read_text()
          entry = '''\n\n## 2026-08-31 21:04:05 IST — C8 Question retention policy (verified) / hourly heartbeat\n\n- **Checklist item attempted:** C8 — School Admin archive policy; permanent delete only for unused mistaken records.\n- **Run start:** 2026-08-31 21:04:05 IST.\n- **Starting branch head:** `20288fa55f5671b4892bb446afa0d5e0ed0bda25` at run inspection; the repository had already advanced through verified C7 work. The start-head documentation-only release-gate run `33395082685` was red, so this run required a fresh exact functional candidate to restore a green release gate before accepting C8.\n- **Repository/CI/deployment/Supabase inspection:** The Phase 1 checklist/progress log, branch head, GitHub Actions, Vercel preview/production and live Evidara Supabase project were inspected before implementation. Vercel production had zero runtime errors/fatals in the preceding 24 hours and remained unchanged. Live Supabase contained 2,805 approved and 35 draft questions; 11 distinct questions were already referenced by papers, confirming that retention must be enforced server-side rather than by UI convention.\n- **Implementation start (first relevant commit):** 2026-08-31 21:14:08 IST — `041b1684dbfdac62942b6bf9bd17e7eec1dac4c5` (`feat(c8): enforce question retention and archive policy`).\n- **Implementation end (final functional/rework commit):** 2026-08-31 21:15:24 IST — `bd19e5f07fac4a025da8be9ebfd05329752651c4` (`fix(c8): bind retention regression to canonical C7 migration`).\n- **Observable elapsed engineering span:** **1m 16s** from first C8 implementation commit to the exact final functional candidate.\n- **Implementation result:** Live migration `phase1_question_retention_policy` installs `enforce_question_retention_policy_v1` and a `BEFORE UPDATE OF status OR DELETE` trigger. Institution archive transitions require School Manager/Super Admin authority; platform archive requires Super Admin. Permanent delete is allowed only for `draft`/`rejected` mistaken records and fails closed for any question referenced by `paper_questions`. The helper is not executable by `public`, `anon` or `authenticated`. A supporting `paper_questions(question_id)` index was applied after advisor inspection identified the retention lookup as an unindexed hot path.\n- **Verification:** GitHub Actions release-gate run `33410259941`, 2026-08-31 21:15:39–21:17:33 IST, duration **1m 54s — PASS**. The dedicated 15/15 C8 regression, every prior P0/A/B/C hardening check, TypeScript, lint, every required regression suite, production build and final release-gate enforcement passed on exact candidate `bd19e5f07fac4a025da8be9ebfd05329752651c4`. Matching Vercel preview `dpl_2vU1DyizdKU9XtuphmkDu8vCwo3L` is READY.\n- **Rework/failures:** The run-start documentation-only CI was already red and was superseded by the clean C8 functional gate. The first C8 smoke referenced the wrong C7 migration filename; it was corrected before final verification. Supabase performance-advisor inspection also exposed the missing paper-question lookup index, which was added before the final gate. Rapid intermediate pushes produced expected concurrency cancellations; no final functional verification failure remained.\n- **Why this run stopped:** C8 reached full live/database + CI + preview verification and was eligible for checklist completion. Safe remaining time was used to identify the next checklist item, C9. C9 is not yet verified and was intentionally left unchecked rather than claiming browser-scale safety from the existing question-bank implementation.\n- **CI/deployment state at stop:** Exact C8 candidate release gate PASS; matching preview READY; permanent production healthy and unchanged. Final production promotion remains blocked by the rest of the Phase 1 checklist, real-school acceptance, load acceptance and production sign-off.\n- **Next action:** C9 — audit every question-bank read path, replace whole-bank browser loading with server-side scoped search/filter/pagination, add count/cursor-or-range semantics and a permanent regression proving the browser never downloads the complete institution bank.\n'''
          marker = '## 2026-08-31 21:04:05 IST — C8 Question retention policy (verified) / hourly heartbeat'
          if marker not in body:
              log.write_text(body.rstrip() + entry)
      - name: Commit documentation
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          if git diff --cached --quiet; then
            echo "Documentation already recorded."
            exit 0
          fi
          git commit -m "docs(c8): record verified retention and heartbeat [skip ci]"
          git push origin HEAD:phase1-hardening

name: Record C9 hourly heartbeat

on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/c7-record-progress.yml']

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Append C9 heartbeat
        shell: python
        run: |
          from pathlib import Path
          log = Path('PHASE1_PROGRESS_LOG.md')
          body = log.read_text()
          marker = '## 2026-08-31 22:05:13 IST — C9 server-side question-bank pagination (in progress) / hourly heartbeat'
          entry = '''\n\n## 2026-08-31 22:05:13 IST — C9 server-side question-bank pagination (in progress) / hourly heartbeat\n\n- **Run start/end:** 2026-08-31 22:05:13 IST → approximately 22:17 IST.\n- **Section worked:** C — Question bank.\n- **Checklist item attempted:** C9 — server-side question search/filter/pagination; do not load the entire bank into the browser. C9 remains **unchecked** because the React question-bank screen still needs conversion from its legacy whole-bank loader to the new bounded RPC. C10 and C11 were not started because C9 is not yet end-to-end complete.\n- **Starting branch head:** `45ea65aa5d3a9ba42574e751a42881d3850aaa2c` (`docs(c8): record verified retention and heartbeat [skip ci]`). The latest verified release gate before C9 was run `33411066539` on its parent documentation checkpoint and was green; the starting documentation head had a Vercel build-rate-limit status rather than a product/runtime failure.\n- **Repository/CI/deployment/Supabase inspection:** Checklist, progress log, branch head, current Actions state, Vercel project and live Supabase were inspected. Permanent production was not changed. Live Supabase contained **2,840 questions**. `live-question-bank.tsx` was confirmed to loop in 1,000-row batches until every question is downloaded and then perform search/filter/pagination in browser memory, proving C9 is a real scale boundary.\n- **Implementation start / commit:** 2026-08-31 during this run — `2ad0ad38c09c6fc60343ce6b5ba8af53dc61dd64` (`feat(c9): add server question-bank pagination rpc`).\n- **Implementation result:** Added and live-applied `phase1_question_bank_pagination` / `search_question_bank_v1`. It is `SECURITY INVOKER`, preserves existing question RLS, accepts platform/school scope plus search, subject/chapter/topic/status/difficulty/grade/exam/date/sort filters, caps page size at **100**, returns only the bounded page question IDs plus total count/stats/facets/school groups, and adds organization/filter pagination indexes. Anonymous EXECUTE is denied; `authenticated` and `service_role` are allowed. Live verification confirmed all three supporting indexes and the expected function grants.\n- **Observable active engineering span:** approximately **12 minutes** of inspect/design/implementation/live verification within the available tool execution window. The requested 45–50 minute productive target was **not met in this runtime window**; no idle padding was added.\n- **Commits created:** `2ad0ad38c09c6fc60343ce6b5ba8af53dc61dd64` plus this heartbeat-workflow commit; the workflow will append this entry in a documentation commit.\n- **CI/deployment state:** The backend commit triggered the normal Phase 1 release gate; final C9 verification is intentionally not claimed until the browser loader is converted, the dedicated C9 regression is wired into the full gate, and an exact candidate passes. Permanent Vercel production remains protected and unchanged.\n- **Vercel/Supabase state:** No production promotion was attempted. The prior C8 preview was READY; the current GitHub Vercel status may remain constrained by the account preview build-rate limit. Supabase migration applied successfully and function permissions/indexes were live-verified.\n- **Rework/failures/blockers:** No database migration failure. Main remaining implementation gap is the 46 KB `live-question-bank.tsx` client conversion: current browser filtering and export/select-all semantics depend on the full in-memory array, so they must be converted carefully rather than merely truncating the query. This is engineering work, not a user-input blocker.\n- **Section progress:** C has 8/11 fully verified items (**72.7%**); C9 is materially in progress.\n- **Overall Phase 1 percentage:** not advanced by this run because C9 has not yet passed the complete gate; checklist completion count is unchanged.\n- **Why the run stopped:** the automation/tool execution window ended before the safe client conversion + complete release gate could be completed; C9 was deliberately left unchecked.\n- **Exact next action:** replace `LiveQuestionBank.load()` whole-bank batching with `search_question_bank_v1`, fetch only returned page IDs with existing nested relations, move totals/stats/facets/school groups to RPC metadata, change review/select/export behavior so it never requires all matching rows in browser memory, add `c9-question-bank-pagination-smoke.mjs`, wire it into `phase1-release-gate.yml`, then run the complete gate and only after PASS mark C9 complete.\n'''
          if marker not in body:
              log.write_text(body.rstrip() + entry)
      - name: Commit heartbeat
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add PHASE1_PROGRESS_LOG.md
          if git diff --cached --quiet; then
            echo "Heartbeat already recorded."
            exit 0
          fi
          git commit -m "docs(c9): record hourly pagination progress [skip ci]"
          git push origin HEAD:phase1-hardening

name: Apply F5 standardized analytics row
on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/c7-record-progress.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Apply F5 product and regression changes
        shell: python {0}
        run: |
          from pathlib import Path
          import re

          source_path = Path('src/components/analytics-v12/student-analytics-v12.tsx')
          source = source_path.read_text()
          replacement = r'''function formatTaxonomyTime(value: number | null) {
            if (value === null || value === undefined) return '—';
            const rounded = Math.max(0, Math.round(value));
            if (rounded < 60) return `${rounded}s`;
            const minutes = Math.floor(rounded / 60);
            const seconds = rounded % 60;
            return seconds ? `${minutes}m ${seconds}s` : `${minutes}m`;
          }

          function MasteryRows({ rows, onSelect }: { rows: AnalyticsTaxonomyRow[]; onSelect?: (row: AnalyticsTaxonomyRow) => void }) {
            if (!rows.length) return <EmptyState title="No evidence yet" copy="This view will populate after completed tests contain matching taxonomy." />;
            return <div className="analytics-v12-mastery-list">{rows.map((row) => {
              const attempted = row.correct + row.incorrect;
              const accuracy = attempted > 0 ? metricValue(row.accuracy, '%') : '—';
              const scorePercentage = row.questions > 0 && row.average_percentage !== null && row.average_percentage !== undefined
                ? metricValue(row.average_percentage, '%')
                : '—';
              const trend = row.trend_delta === null
                ? '—'
                : `${row.trend_delta >= 0 ? '▲' : '▼'} ${Math.abs(round(row.trend_delta, 1) || 0)} pts`;
              return <button type="button" key={row.id} className="analytics-v12-mastery-row" onClick={() => onSelect?.(row)} disabled={!onSelect}>
                <span className="analytics-v12-mastery-head">
                  <span className="analytics-v12-mastery-name">{row.name}</span>
                  <span className="analytics-v12-bar-track" aria-label={`Accuracy ${accuracy}`}><span className={`analytics-v12-bar-fill ${attempted > 0 && row.accuracy < 70 ? 'attention' : ''}`} style={{ width: `${attempted > 0 ? clamp(row.accuracy) : 0}%` }} /></span>
                </span>
                <span className="analytics-v12-mastery-metrics">
                  <span><small>Exposure</small><strong>{row.questions}</strong></span>
                  <span><small>Attempted</small><strong>{attempted}</strong></span>
                  <span><small>Correct</small><strong>{row.correct}</strong></span>
                  <span><small>Incorrect</small><strong>{row.incorrect}</strong></span>
                  <span><small>Unanswered</small><strong>{row.unanswered}</strong></span>
                  <span><small>Accuracy</small><strong>{accuracy}</strong></span>
                  <span><small>Score %</small><strong>{scorePercentage}</strong></span>
                  <span><small>Time</small><strong>{formatTaxonomyTime(row.average_seconds)}</strong></span>
                  <span><small>Trend</small><strong className={`analytics-v12-mini-trend ${(row.trend_delta || 0) < 0 ? 'down' : ''}`}>{trend}</strong></span>
                  <span><small>Evidence</small><strong>{row.attempts}</strong></span>
                </span>
              </button>;
            })}</div>;
          }

          function PriorityList'''
          source, count = re.subn(r'function MasteryRows\(.*?\n}\n\nfunction PriorityList', replacement, source, count=1, flags=re.S)
          if count != 1:
            raise SystemExit(f'Expected one MasteryRows block, replaced {count}')
          source_path.write_text(source)

          css_path = Path('src/components/analytics-v12/analytics-v12.css')
          css = css_path.read_text()
          marker = '/* F5 standardized taxonomy evidence row */'
          if marker not in css:
            css += '''\n/* F5 standardized taxonomy evidence row */
          .analytics-v12-mastery-row{display:block;width:100%;border:1px solid var(--a-line);border-radius:10px;background:#fff;padding:12px 13px;text-align:left;color:#173047}
          .analytics-v12-mastery-row:not(:disabled):hover{background:#f7fbfb;border-color:#cbdedc}
          .analytics-v12-mastery-head{display:grid;grid-template-columns:minmax(120px,180px) minmax(120px,1fr);gap:14px;align-items:center;margin-bottom:10px}
          .analytics-v12-mastery-name{font-size:12px;font-weight:700;line-height:1.3}
          .analytics-v12-mastery-metrics{display:grid;grid-template-columns:repeat(5,minmax(72px,1fr));gap:8px}
          .analytics-v12-mastery-metrics>span{display:grid;gap:3px;min-width:0;padding:6px 7px;border-radius:7px;background:#f8fafb}
          .analytics-v12-mastery-metrics small{color:var(--a-muted);font-size:8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
          .analytics-v12-mastery-metrics strong{font-size:10px;line-height:1.25;white-space:nowrap}
          @media(max-width:900px){.analytics-v12-mastery-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.analytics-v12-mastery-head{grid-template-columns:1fr}}
          '''
            css_path.write_text(css)

          smoke = r'''import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const source = fs.readFileSync('src/components/analytics-v12/student-analytics-v12.tsx', 'utf8');
          const css = fs.readFileSync('src/components/analytics-v12/analytics-v12.css', 'utf8');
          const sql = fs.readFileSync('supabase/45_v12_evidence_analytics.sql', 'utf8');

          const checks = [
            ['shared taxonomy row exposes Exposure', source.includes('<small>Exposure</small><strong>{row.questions}</strong>')],
            ['Attempted follows canonical correct + incorrect denominator', source.includes('const attempted = row.correct + row.incorrect;')],
            ['row exposes Attempted', source.includes('<small>Attempted</small><strong>{attempted}</strong>')],
            ['row exposes Correct', source.includes('<small>Correct</small><strong>{row.correct}</strong>')],
            ['row exposes Incorrect', source.includes('<small>Incorrect</small><strong>{row.incorrect}</strong>')],
            ['row exposes Unanswered', source.includes('<small>Unanswered</small><strong>{row.unanswered}</strong>')],
            ['Accuracy fails closed without attempted evidence', source.includes("const accuracy = attempted > 0 ? metricValue(row.accuracy, '%') : '—';")],
            ['row exposes weighted Score %', source.includes('<small>Score %</small><strong>{scorePercentage}</strong>')],
            ['Score % is backed by marks-awarded / marks SQL', /round\(100 \* sum\(marks_awarded\)::numeric \/ greatest\(sum\(marks\),1\), 1\) as average_percentage/.test(sql)],
            ['row exposes Time', source.includes('<small>Time</small><strong>{formatTaxonomyTime(row.average_seconds)}</strong>')],
            ['row exposes Trend', source.includes('<small>Trend</small>') && source.includes("' pts'".trim()) === false ? true : source.includes('pts`')],
            ['row exposes evidence-record count', source.includes('<small>Evidence</small><strong>{row.attempts}</strong>')],
            ['SQL exposure counts all question opportunities', sql.includes('count(*)::integer as questions')],
            ['SQL evidence records count recorded responses', sql.includes('count(*) filter(where response_recorded)::integer as attempts')],
            ['responsive standardized metric grid is present', css.includes('/* F5 standardized taxonomy evidence row */') && css.includes('.analytics-v12-mastery-metrics{display:grid;grid-template-columns:repeat(5')],
          ];

          let passed = 0;
          for (const [name, ok] of checks) {
            assert.ok(ok, `F5 check failed: ${name}`);
            console.log(`PASS: ${name}`);
            passed += 1;
          }
          console.log(`F5 standardized analytics row checks passed: ${passed}/${checks.length}`);
          '''
          Path('scripts/f5-standard-analytics-row-smoke.mjs').write_text(smoke)
      - name: Run F5 smoke
        run: node scripts/f5-standard-analytics-row-smoke.mjs
      - name: Commit F5 implementation
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add src/components/analytics-v12/student-analytics-v12.tsx src/components/analytics-v12/analytics-v12.css scripts/f5-standard-analytics-row-smoke.mjs
          git diff --cached --quiet || (git commit -m "feat(f5): standardize taxonomy analytics evidence row" && git push origin HEAD:phase1-hardening)

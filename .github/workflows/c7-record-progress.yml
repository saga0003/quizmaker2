name: Apply F7 taxonomy evidence
on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/c7-record-progress.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Apply F7 patch
        run: python scripts/f7-apply.py
      - name: Run F7 smoke
        run: node scripts/f7-taxonomy-evidence-smoke.mjs
      - name: Commit F7 implementation
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git rm scripts/f7-apply.py
          git add src/app/api/institution-analytics/route.ts src/components/institution-analytics/institution-analytics-workspace.tsx scripts/f7-taxonomy-evidence-smoke.mjs
          git commit -m "feat(f7): expose taxonomy response evidence metrics"
          git push origin HEAD:phase1-hardening

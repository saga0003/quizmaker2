name: Record F3 hourly heartbeat
on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/c7-record-progress.yml
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Append F3 heartbeat
        shell: python {0}
        run: |
          from pathlib import Path
          import re, subprocess
          checklist=Path('PHASE1_RELEASE_CHECKLIST.md').read_text()
          log=Path('PHASE1_PROGRESS_LOG.md')
          body=log.read_text()
          marker='## 2026-09-01 15:00:07 IST — F3 denominator-aware analytics implementation / hourly heartbeat'
          items=re.findall(r'^- \[([ x])\]', checklist, re.M)
          done=sum(v=='x' for v in items); total=len(items)
          fm=re.search(r'^# F —.*?(?=^# G —)', checklist, re.M|re.S)
          fi=re.findall(r'^- \[([ x])\]', fm.group(0), re.M) if fm else []
          fd=sum(v=='x' for v in fi)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          entry=f'''\n\n{marker}\n\n- **Run start/end:** 2026-09-01 15:00:07 IST → approximately 15:13 IST.\n- **Active engineering/review span:** approximately **13 minutes** in the observable execution window. The requested 45–50 minute target was not met because the available automation/tool window was materially shorter; no idle padding was added.\n- **Section worked:** F — Analytics and reporting; active item F3.\n- **Checklist items completed this run:** none yet. F3 remains intentionally unchecked until the exact cleanup candidate passes the complete release gate.\n- **Items still pending in active section:** F3 final complete-gate acceptance, then F4 onward.\n- **Branch head at heartbeat source:** `{{head}}`; F3 product commit `1bca668e2580dea00c6773b9528b9bca506f6a1d`; release-gate wiring commit `093f14bc7db89d772643d3f5c391442cbe466883`; cleaned candidate `57d8c6c4ff642bde93d8272ccba3322316baacaf`.\n- **Commits created:** staging/rework `0e7d1c64055a4c1e77323f5ce4fcf3dbeb353fbc`, `bb2f07d0f8ad4a3399bba6e06143a022aeba08cb`, `221858a3cedb552890c13e9272146aadd3d0c084`, `5346f347f87514e3982faa084eb3ed83481aeb2c`; product `1bca668e2580dea00c6773b9528b9bca506f6a1d`; gate `093f14bc7db89d772643d3f5c391442cbe466883`; cleanup `57d8c6c4ff642bde93d8272ccba3322316baacaf`; plus this recorder staging commit.\n- **Implementation result:** missing analytics evidence now remains null and renders `— / Not assessed` rather than `0%` in legacy launch/demo hierarchy, subject donuts, topic bars and no-student derived-rate surfaces; genuine measured zero remains `0%`. Permanent `f3-not-assessed-smoke.mjs` has 15 assertions and is wired into the complete release gate.\n- **CI run/result:** the guarded patch passed all **15/15** F3 checks. Initial source-patch workflow attempts failed before product publication due YAML/workflow-token permission boundaries and were reworked safely. Final complete release gate `33493636272` on cleaned candidate `57d8c6c4ff642bde93d8272ccba3322316baacaf` was **in progress** at heartbeat time, so F3 was not checked prematurely.\n- **Vercel state:** production project `quizmaker2` had **no error/fatal runtime logs in the preceding 24 hours**. No production deployment/promotion was attempted.\n- **Supabase state:** project `xzfozpnzvznqrvcsoail` is **ACTIVE_HEALTHY**. F3 required no database migration or mutation.\n- **Rework/failures/blockers:** the first embedded staging workflow was rejected with zero jobs; the simplified workflow then proved the F3 patch and 15/15 smoke, but its push was rejected because the workflow token cannot modify release workflows. Product and workflow-wiring commits were separated; no failed attempt changed production. No user-input blocker remains.\n- **Section progress:** F remains {{fd}}/{{len(fi)}} verified (**{{(100*fd/len(fi) if fi else 0):.1f}}%**) until F3 gate completes.\n- **Overall Phase 1 percentage:** {{done}}/{{total}} verified (**{{(100*done/total if total else 0):.1f}}%**) until F3 is formally accepted.\n- **Exact next action:** inspect release gate `33493636272`; if PASS, mark F3 verified with exact gate evidence and immediately start F4. If it fails, fix the failing regression/type/build issue before any checklist update.\n'''
          if marker not in body:
            log.write_text(body.rstrip()+entry)
      - name: Commit heartbeat
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add PHASE1_PROGRESS_LOG.md
          git diff --cached --quiet || (git commit -m "docs(f3): record denominator-aware analytics heartbeat" && git push origin HEAD:phase1-hardening)

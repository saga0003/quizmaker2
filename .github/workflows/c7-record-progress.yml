name: Record E6 verification and E7 handoff
on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/c7-record-progress.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Record E6 verification and heartbeat
        shell: python {0}
        run: |
          from pathlib import Path
          import re, subprocess
          checklist_path=Path('PHASE1_RELEASE_CHECKLIST.md')
          checklist=checklist_path.read_text()
          old='- [ ] E6 Idempotent submission and clear submission receipt.'
          new='- [x] **E6 Idempotent submission and clear submission receipt** — verified 1 Sep 2026. `submit_exam_attempt` serializes concurrent/retried final submissions with an attempt-row `FOR UPDATE`, skips re-scoring after submission, persists one stable `submission_receipt_id` plus authoritative confirmation time in attempt metadata, and returns the same durable receipt on replay. Legacy submitted attempts receive one receipt under the same lock. Anonymous execution is denied and authenticated execution retained. The learner enters the clear “Test submitted” confirmation only from the authoritative server response after all pending answers are confirmed. Live Supabase verification showed receipt logic active with 0 attempts affected; exact candidate `bafcf8e267c311458583876567af9a0fbb2ae5cd` passed complete release gate `33470270087` and its Vercel preview reached READY. Permanent production was not promoted.'
          if old in checklist:
            checklist=checklist.replace(old,new,1)
          elif new not in checklist:
            raise SystemExit('E6 checklist marker not found')
          checklist_path.write_text(checklist)

          log=Path('PHASE1_PROGRESS_LOG.md'); body=log.read_text()
          marker='## 2026-09-01 09:58:54 IST — E6 verified; E7 evidence-report review started / hourly heartbeat'
          updated=checklist_path.read_text(); items=re.findall(r'^- \[([ x])\]',updated,re.M); done=sum(v=='x' for v in items); total=len(items)
          em=re.search(r'^# E —.*?(?=^# F —)',updated,re.M|re.S); ei=re.findall(r'^- \[([ x])\]',em.group(0),re.M) if em else []; ed=sum(v=='x' for v in ei)
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          entry=f'''\n\n{marker}\n\n- **Run start/end:** 2026-09-01 09:58:54 IST → approximately 10:12 IST.\n- **Active engineering/review span:** approximately **13 minutes** in the observable execution window. The requested 45–50 minute target was not reached because the runtime window available for this block ended materially earlier; no idle padding was added.\n- **Section worked:** E — Learner exam runtime.\n- **Checklist items completed this run:** E6 — idempotent/replay-safe final submission with a durable server-confirmed submission receipt.\n- **Items still pending in active section:** E7 integrity report must be presented as neutral events/evidence, not as “cheating prevention”; E8 concurrent start/save/submit load acceptance.\n- **Branch head at heartbeat source:** `{{head}}`; exact E6 engineering candidate: `bafcf8e267c311458583876567af9a0fbb2ae5cd`.\n- **Commits created this run:** `bafcf8e267c311458583876567af9a0fbb2ae5cd` (`hardening(e6): persist stable submission receipt`) plus this recorder staging commit; the recorder creates the checklist/log commit automatically.\n- **CI run and duration/result:** complete Phase-1 release gate `33470270087` for exact E6 candidate `bafcf8e267c311458583876567af9a0fbb2ae5cd` ran from 10:03:14–10:05:16 IST (approximately **2m02s**) and passed. E6 permanent smoke, TypeScript, lint, all legacy regressions, production build and final enforcement were green.\n- **Vercel state:** connected project `quizmaker2` (`prj_NvZZl1cJh6I1NfGHePAnAztGr8nY`) was resolved correctly. Exact E6 preview `dpl_CGmorKsHjnvH9fjfpA6iuU61hbru` reached **READY** with `target=null` (preview only); Vercel reported no runtime errors in the previous 24 hours. No production promotion was attempted.\n- **Supabase state:** project `xzfozpnzvznqrvcsoail`; migration `phase1_e6_submission_receipt` applied successfully. Live verification: receipt logic present, anon EXECUTE=false, authenticated EXECUTE=true, **0 attempts / 0 submitted attempts / 3 papers / 0 published papers**, so no existing learner attempt was mutated by the migration. `exam_attempt_events` and its authenticated RLS read policy were also inspected for E7 and correctly scope evidence to the owning learner or authorized paper manager.\n- **Rework/failures/blockers:** one read-only E7 policy-introspection query used the wrong catalog column name (`polname` instead of `policyname`) and failed harmlessly; it was corrected immediately. The earlier Vercel project-ID verification limitation was resolved by connected-team/project discovery. No product rollback or production incident occurred. E7 remains intentionally unchecked because the manager-facing neutral evidence report is not yet implemented/gated.\n- **Section progress:** E has {{ed}}/{{len(ei)}} verified items (**{{(100*ed/len(ei) if ei else 0):.1f}}%**).\n- **Overall Phase 1 percentage:** {{done}}/{{total}} checklist items verified (**{{(100*done/total if total else 0):.1f}}%**).\n- **Target status:** 45–50 minute productive target **not met** because the available execution window was materially shorter; limitation recorded explicitly.\n- **Exact next action:** implement E7 as a paper-manager integrity-evidence report backed by RLS-scoped `exam_attempt_events`, using neutral event/timestamp/evidence wording and explicitly avoiding claims that Evidara “prevents cheating”; add a permanent E7 regression and run the complete gate. Then continue immediately to E8 concurrent start/save/submit load acceptance.\n'''
          if marker not in body:
            log.write_text(body.rstrip()+entry)
      - name: Commit verification record
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          git diff --cached --quiet || (git commit -m "docs(e6): verify durable submission receipt" && git push origin HEAD:phase1-hardening)

name: Record C10 verification and C11 discovery
on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/c7-record-progress.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Record verified C10 and C11 discovery
        shell: python {0}
        run: |
          from pathlib import Path
          import re
          checklist_path=Path('PHASE1_RELEASE_CHECKLIST.md')
          checklist=checklist_path.read_text()
          old='- [ ] C10 Simplify “Add Questions” to Upload → Map → Review → Import; “Create Paper” optional.'
          new='- [x] **C10 Simplified Add Questions flow** — verified 1 Sep 2026. The institution import experience is explicitly Upload → Map → Review → Import, with taxonomy-aware mapping, invalid-row blocking, learner preview, and optional Create Paper preserved as an atomic extension of the import rather than a mandatory step. The permanent 12-point `c10-simplified-import-flow-smoke.mjs` is wired into every release gate. An obsolete clean-school regression was updated to assert the new four-step wording. Exact candidate `c28151dc27ea11100e636328de0c9e9abc916588` passed release-gate run `33437505965` from 20:42:40Z–20:45:01Z (2m 21s), including C9/C10, TypeScript, lint, all regressions, production build and final enforcement. The C10 product preview at commit `368305bedc76aff8e2ebb7dfc5e9e69d8f522cf3` is READY; the later candidate changes only regression/gate definitions. Permanent production was not promoted.'
          if old in checklist:
              checklist=checklist.replace(old,new,1)
              checklist_path.write_text(checklist)
          elif new not in checklist:
              raise SystemExit('C10 checklist marker not found')

          log=Path('PHASE1_PROGRESS_LOG.md'); body=log.read_text()
          marker='## 2026-09-01 01:59:31 IST — C10 verified; C11 duplicate-scope audit started / final heartbeat'
          updated=checklist_path.read_text(); items=re.findall(r'^- \[([ x])\]',updated,re.M); done=sum(v=='x' for v in items); total=len(items)
          cm=re.search(r'^# C —.*?(?=^# D —)',updated,re.M|re.S); ci=re.findall(r'^- \[([ x])\]',cm.group(0),re.M) if cm else []; cd=sum(v=='x' for v in ci)
          entry=f'''\n\n{marker}\n\n- **Run start/end:** 2026-09-01 01:59:31 IST → approximately 02:16 IST.\n- **Active engineering/review span:** approximately **16 minutes** in the available automation execution window; the requested 45–50 minute target was not reached because the runtime window ended earlier. No idle padding was added.\n- **Section worked:** C — Question bank.\n- **Checklist items completed this run:** C9 and C10.\n- **Items still pending in active section:** C11 only.\n- **Branch head used for C10 verification:** `c28151dc27ea11100e636328de0c9e9abc916588`.\n- **Commits created:** `a69fb6ffae01aab22cf615f0796c7aab252a9a77` (align V14 teacher-scope regression with server search), `b7b864259adaccf0f0ebcd46fadf3a18830b294b` (permanent C9 gate), `a3d129f1f302464578e8ace3cd5af54d421c08e5` (remove temporary C9 workflow), `368305bedc76aff8e2ebb7dfc5e9e69d8f522cf3` (simplify C10 UI + 12-point regression), `38c171bfc56c6bb4ccfc24e20933f0114d9104be` (permanent C10 gate), `c28151dc27ea11100e636328de0c9e9abc916588` (align clean-school regression).\n- **CI:** C9 exact gate `33436500099` PASS in 2m55s. First C10 gate `33437157013` correctly failed only an obsolete clean-school wording assertion; after rework, exact C10 gate `33437505965` PASS in **2m21s**, with C10 12/12, clean-school 40/40, TypeScript, lint, every regression, production build and final enforcement green.\n- **Vercel:** C10 product preview for `368305bedc76aff8e2ebb7dfc5e9e69d8f522cf3` is READY. Permanent production remained on the known-good `main` deployment and had no runtime errors during the run; it was not promoted.\n- **Supabase:** project remained ACTIVE_HEALTHY. C9 live bank remained 2,840 questions and the search RPC authenticated-only. C11 discovery found the current `duplicate_hash` is populated on only 220/2,840 questions; a naive backfill with the old stem-text/options hash produces four false duplicate groups because many source-fidelity questions store their actual stem in `stem_latex`. A v2 fingerprint including text/LaTeX/image/passage/type yields **zero** duplicate groups across the current bank. This is now the required safe basis for C11; no destructive duplicate cleanup was performed.\n- **Rework/failures/blockers:** C10 required one legitimate regression rework after gate `33437157013`; the obsolete clean-school test expected the retired step labels. It was corrected and the full gate passed. C11 is not blocked by user input, but requires a coordinated server migration so `save_question`, bulk import duplicate reuse and a scoped uniqueness constraint all use the same v2 fingerprint atomically.\n- **Section progress:** C has {{cd}}/{{len(ci)}} verified items (**{{(100*cd/len(ci) if ci else 0):.1f}}%**).\n- **Overall Phase 1 percentage:** {{done}}/{{total}} checklist items verified (**{{(100*done/total if total else 0):.1f}}%**).\n- **Why the run stopped:** the automation execution window ended after C10 verification and C11 data-model discovery; implementing the coordinated C11 hash migration without enough verification time would be unsafe.\n- **Exact next action:** implement C11 with one authoritative v2 duplicate fingerprint covering text, LaTeX, image, passage, question type and canonical options; backfill safely, enforce per-institution/platform uniqueness at the database layer, make both `save_question` and atomic bulk import reuse/check the same fingerprint, add a permanent C11 concurrency/scope regression, live-verify Supabase, run the complete release gate and then close Section C before starting D1.\n'''
          if marker not in body:
              log.write_text(body.rstrip()+entry)
      - name: Commit verification record
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          git diff --cached --quiet || (git commit -m "docs(c10): verify simplified import flow and start C11" && git push origin HEAD:phase1-hardening)
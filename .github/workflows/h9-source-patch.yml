name: H9 Source Patch

on:
  push:
    branches:
      - phase1-hardening

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'apply staged accessibility source patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Apply guarded H9 patch
        run: python scripts/h9-apply-accessibility-patch.py
      - name: Commit source patch
        run: |
          git config user.name "evidara-phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/institution-analytics/institution-analytics-workspace.tsx
          git commit -m "feat(h9): label analytics controls for assistive tech"
          git push origin HEAD:phase1-hardening

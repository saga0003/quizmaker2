name: H9 Accessibility Contract

on:
  push:
    branches: [phase1-hardening, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  accessibility-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: H9 accessibility baseline regression
        run: node scripts/h9-accessibility-smoke.mjs

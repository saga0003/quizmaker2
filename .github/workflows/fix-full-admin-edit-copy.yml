name: Fix full admin edit guidance

on:
  push:
    branches:
      - fix/full-admin-edit-after-attempts-2026-09-23

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-admin-edit-after-attempts-2026-09-23
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch guidance copy
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/components/evidara/live-paper-catalogue-v8.tsx';
          let s = fs.readFileSync(path, 'utf8');
          const before = `{editingPaperHasAttempts && <p className="text-xs leading-5 text-[var(--muted-foreground)]">This changes only the allowed-attempt count. Existing attempts and analytics remain unchanged.</p>}`;
          const after = `{editingPaperHasAttempts && <p className="text-xs leading-5 text-[var(--muted-foreground)]">{postAttemptLimitedEdit ? 'This changes only the allowed-attempt count. Existing attempts and analytics remain unchanged.' : 'Existing attempts, scores and analytics remain unchanged. Your saved changes apply to future attempts.'}</p>}`;
          const count = s.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected one guidance-copy match, found ${count}`);
          s = s.replace(before, after);
          fs.writeFileSync(path, s);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and lint
        run: |
          npx tsc --noEmit
          npm run lint

      - name: Verify admin guidance
        run: |
          grep -q "Your saved changes apply to future attempts" src/components/evidara/live-paper-catalogue-v8.tsx

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-full-admin-edit-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clarify full admin edit behavior after attempts"
          git push origin HEAD:fix/full-admin-edit-after-attempts-2026-09-23

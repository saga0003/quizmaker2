name: Record F2 verification

'on':
  push:
    branches:
      - phase1-hardening
    paths:
      - '.github/workflows/f2-recorder.yml'

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - run: python scripts/f2-recorder.py
      - run: |
          git config user.name "Evidara Phase 1 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "docs(f2): record verified analytics dictionary and heartbeat [skip ci]"
          git push origin HEAD:phase1-hardening

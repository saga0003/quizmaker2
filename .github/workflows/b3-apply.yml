name: Apply B3 student import hardening

on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/b3-apply.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Add server-authoritative student import
        env:
          B3_BLOCK: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('src/app/api/access-control/route.ts')
          text = path.read_text()
          marker = "    } else if (action === 'bulkCreateAccounts') {"
          if marker not in text:
              raise SystemExit('bulkCreateAccounts marker not found')
          block = base64.b64decode(os.environ['B3_BLOCK']).decode()
          path.write_text(text.replace(marker, block + marker, 1))
          PY
      - name: Commit B3 server
        run: |
          git config user.name "saga0003"
          git config user.email "sagar@smis.edu.in"
          git add src/app/api/access-control/route.ts
          git commit -m "feat(b3): enforce validated student roster imports"
          git push origin phase1-hardening

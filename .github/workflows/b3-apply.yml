name: Apply B3 student import hardening

on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/b3-apply.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Repair B3 UI import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/evidara/bulk-account-import.tsx')
          text = p.read_text()
          old = "import { Button } from '@/components/ui/button';"
          new = "import { Badge } from '@/components/ui/badge';\nimport { Button } from '@/components/ui/button';"
          if old not in text:
              raise SystemExit('Button import anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Commit B3 UI repair
        run: |
          git config user.name "saga0003"
          git config user.email "sagar@smis.edu.in"
          git add src/components/evidara/bulk-account-import.tsx
          git commit -m "fix(b3): import validation status badge"
          git push origin phase1-hardening

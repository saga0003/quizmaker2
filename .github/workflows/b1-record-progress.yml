name: Record verified B1 progress

on:
  push:
    branches:
      - phase1-hardening

permissions:
  contents: write

jobs:
  record:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Record B1 verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          checklist = Path('PHASE1_RELEASE_CHECKLIST.md')
          text = checklist.read_text()
          old = '- [ ] B1 Transactional institution onboarding: institution + licence + first School Admin + membership + defaults + audit.'
          new = '- [x] B1 Transactional institution onboarding: institution + licence + first School Admin + membership + defaults + audit — verified 31 Aug 2026. Live migration `phase1_transactional_institution_onboarding` installs service-role-only `onboard_institution_v1`, which creates the institution, ₹199/student annual licence, active first School Admin membership/profile state, onboarding defaults and audit event in one PostgreSQL transaction. A deliberate incompatibility failure after tenant rows had begun proved rollback with zero residual institution rows; `anon` and `authenticated` cannot execute the RPC. Exact candidate `e4e6fb64d429f561018f3bb612585475d55bc20c` passed the complete release gate in run `33373586495` and its matching Vercel preview is READY.'
          if old in text:
              checklist.write_text(text.replace(old, new, 1))
          log = Path('PHASE1_PROGRESS_LOG.md')
          log_text = log.read_text()
          marker = '## 2026-08-31 13:59:53 IST — B1 Transactional institution onboarding (verified)'
          if marker not in log_text:
              entry = '''\n\n## 2026-08-31 13:59:53 IST — B1 Transactional institution onboarding (verified)\n\n- **Checklist item:** B1 — Transactional institution onboarding: institution + licence + first School Admin + membership + defaults + audit.\n- **Run start:** 2026-08-31 13:59:53 IST.\n- **Repository/CI/deployment inspection:** The canonical `phase1-hardening` head `199c7024d758f51fa3921ac153a591f6c906c7d4` was confirmed green in release-gate run `33369556500`. Vercel production runtime errors for the preceding 24 hours were clean and the live Supabase project reported `ACTIVE_HEALTHY`, so no production incident remediation was required.\n- **Implementation start (first relevant commit):** 2026-08-31 14:04:58 IST — `e4e6fb64d429f561018f3bb612585475d55bc20c` (`feat(b1): add transactional institution onboarding`).\n- **Implementation end (final verified candidate commit):** 2026-08-31 14:04:58 IST — the same atomic functional commit `e4e6fb64d429f561018f3bb612585475d55bc20c`.\n- **Observable elapsed engineering span:** 0m 00s between first and final relevant commits because B1 was delivered as one atomic functional commit; discovery and live verification occurred within this hourly run.\n- **Verification:** GitHub Actions release-gate run `33373586495`, 2026-08-31 14:05:04–14:07:38 IST, duration **2m 34s — PASS**. The permanent 16-point B1 regression, all prior P0/A checks, TypeScript, lint, every required regression suite, production build and final gate enforcement passed. Matching Vercel preview for the exact candidate is READY.\n- **Live database evidence:** Migration `phase1_transactional_institution_onboarding` was applied successfully. `onboard_institution_v1` is executable by `service_role` and not by `anon`/`authenticated`. A rollback probe intentionally selected an incompatible first-admin role after institution/licence/member writes had begun; the function failed and left `0` residual probe organizations, proving the bootstrap rows roll back together.\n- **Implementation result:** A privileged server route now delegates tenant bootstrap to one database transaction. It validates Super Admin authority and an explicit existing first School Admin account, then atomically creates the organization, annual ₹199/student licence with defaults, active School Admin membership/profile state and `institution.onboarded` audit record. Partial institution/licence state can no longer be left behind by a later onboarding write failure.\n- **Rework/failures:** No functional or CI failure. The first implementation candidate passed its dedicated B1 regression and complete release gate.\n- **Deployment/health:** Production runtime remained clean and the permanent production deployment was not promoted. Only the live backward-compatible B1 database function was added; final real-school acceptance remains incomplete.\n- **Next action:** B2 — consolidate institution details, licence configuration and first School Admin selection into one guided Super Admin onboarding wizard that calls the verified B1 transactional endpoint.\n'''
              log.write_text(log_text.rstrip() + entry)
          PY
          if git diff --quiet; then
            echo 'Nothing to record.'
            exit 0
          fi
          git config user.name 'Evidara Hardening Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          git commit -m 'docs(b1): record verified transactional onboarding'
          git push

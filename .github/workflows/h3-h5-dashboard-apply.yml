name: Apply H3 H5 dashboard focus
on:
  push:
    branches: [phase1-hardening]
    paths:
      - '.github/workflows/h3-h5-dashboard-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Patch dashboards and add regression
        run: |
          python - <<'PY'
          from pathlib import Path

          school = Path('src/components/evidara/school-views.tsx')
          s = school.read_text()
          old = """  const [contentMetrics, setContentMetrics] = useState({ questions: 0, papers: 0 });\n"""
          new = """  const [contentMetrics, setContentMetrics] = useState({ questions: 0, papers: 0 });\n  const [schoolAdminMetrics, setSchoolAdminMetrics] = useState<{ teachers: number | null; participation: number | null; averageScore: number | null }>({ teachers: null, participation: null, averageScore: null });\n"""
          if old not in s: raise SystemExit('missing school metric state anchor')
          s = s.replace(old, new, 1)

          old = """  const quickActions = [\n    { label: teacher ? 'New My Question' : 'New Question', icon: FilePlus, view: 'school-questions' as const },\n    { label: 'Create Paper', icon: FileText, view: 'school-papers' as const },\n    { label: teacher ? 'Assigned Students' : 'Manage Students', icon: Users, view: 'school-students' as const },\n    { label: 'View Analytics', icon: BarChart3, view: 'school-analytics-overview' as const },\n  ];\n"""
          new = """  const quickActions = teacher\n    ? [\n        { label: 'Upload Questions', icon: FilePlus, view: 'school-questions' as const },\n        { label: 'Create Test', icon: FileText, view: 'school-papers' as const },\n        { label: 'Upcoming Tests', icon: FileText, view: 'school-papers' as const },\n        { label: 'Recent Results', icon: BarChart3, view: 'school-analytics-overview' as const },\n      ]\n    : [\n        { label: 'Manage Students', icon: Users, view: 'school-students' as const },\n        { label: 'Manage Teachers', icon: Users, view: 'school-access' as const },\n        { label: 'Create Test', icon: FileText, view: 'school-papers' as const },\n        { label: 'View Results', icon: BarChart3, view: 'school-analytics-overview' as const },\n      ];\n"""
          if old not in s: raise SystemExit('missing quick action anchor')
          s = s.replace(old, new, 1)

          anchor = """  }, [profile?.id, salesDemoMode, state.school.id, teacher]);\n\n  if (!ready)\n"""
          addition = """  }, [profile?.id, salesDemoMode, state.school.id, teacher]);\n\n  useEffect(() => {\n    if (teacher || salesDemoMode || !supabase || !state.school.id) {\n      setSchoolAdminMetrics({ teachers: null, participation: null, averageScore: null });\n      return;\n    }\n    let cancelled = false;\n    void (async () => {\n      try {\n        const { data: sessionData } = await supabase.auth.getSession();\n        const token = sessionData.session?.access_token;\n        if (!token) throw new Error('Your Evidara session has expired.');\n        const headers = { Authorization: `Bearer ${token}`, 'x-evidara-organization-id': state.school.id };\n        const [accessResponse, analyticsResponse] = await Promise.all([\n          fetch(`/api/access-control/?organizationId=${encodeURIComponent(state.school.id)}&page=1&pageSize=1&role=school_teacher`, { headers, cache: 'no-store' }),\n          fetch(`/api/institution-analytics?level=school&organizationId=${encodeURIComponent(state.school.id)}`, { headers, cache: 'no-store' }),\n        ]);\n        const accessPayload = await accessResponse.json() as { accountPage?: { total?: number } };\n        const analyticsPayload = await analyticsResponse.json() as { classes?: Array<{ studentCount: number; participation: number | null; averagePercentage: number | null }> };\n        if (!accessResponse.ok) throw new Error('Unable to load teacher count.');\n        if (!analyticsResponse.ok) throw new Error('Unable to load school assessment summary.');\n        const classes = analyticsPayload.classes || [];\n        const weighted = (key: 'participation' | 'averagePercentage') => {\n          const rows = classes.filter((row) => row[key] != null && row.studentCount > 0);\n          const denominator = rows.reduce((sum, row) => sum + row.studentCount, 0);\n          if (!denominator) return null;\n          return rows.reduce((sum, row) => sum + Number(row[key]) * row.studentCount, 0) / denominator;\n        };\n        if (!cancelled) setSchoolAdminMetrics({\n          teachers: Number(accessPayload.accountPage?.total ?? 0),\n          participation: weighted('participation'),\n          averageScore: weighted('averagePercentage'),\n        });\n      } catch {\n        if (!cancelled) setSchoolAdminMetrics({ teachers: null, participation: null, averageScore: null });\n      }\n    })();\n    return () => { cancelled = true; };\n  }, [salesDemoMode, state.school.id, teacher]);\n\n  if (!ready)\n"""
          if anchor not in s: raise SystemExit('missing effect insertion anchor')
          s = s.replace(anchor, addition, 1)

          old = """      <div className=\"grid gap-3 sm:grid-cols-2 sm:gap-4 lg:grid-cols-4\">\n        <StatCard\n          icon={Users}\n          label={teacher ? 'Students in scope' : 'Active students'}\n          value={String(activeStudents)}\n          sub={\n            salesDemoMode && salesDemo\n              ? `${salesDemo.stats.neetStudents} NEET + ${salesDemo.stats.jeeStudents} JEE · ${Math.max(0, seatLimit - activeStudents)} of ${seatLimit} licences available`\n              : teacher\n                ? 'Only actively assigned sections'\n                : seatLimit > 0\n                  ? `${Math.max(0, seatLimit - activeStudents)} of ${seatLimit} seats available`\n                  : state.school.subscription.status === 'active'\n                    ? 'Unlimited student access'\n                    : 'Activates with institution plan'\n          }\n        />\n        <StatCard\n          icon={BookOpen}\n          label={salesDemoMode ? 'Demo question instances' : teacher ? 'My questions' : 'School questions'}\n          value={String(displayedQuestions)}\n          sub={salesDemoMode ? 'Across seeded chapter, topic, mock and full-length tests' : 'Live question count'}\n        />\n        <StatCard\n          icon={FileText}\n          label={salesDemoMode ? 'Demo tests' : teacher ? 'My papers' : 'School papers'}\n          value={String(displayedPapers)}\n          sub={salesDemoMode && salesDemo ? `${salesDemo.stats.attempts.toLocaleString('en-IN')} submitted demo attempts` : 'Live paper count'}\n        />\n        <StatCard\n          icon={BookOpen}\n          label=\"Resources\"\n          value={String(state.resources.length)}\n          sub=\"Authorized live resources\"\n        />\n      </div>\n"""
          new = """      {teacher ? (\n        <div className=\"grid gap-3 sm:grid-cols-2 sm:gap-4 lg:grid-cols-4\">\n          <StatCard icon={Users} label=\"Students in scope\" value={String(activeStudents)} sub=\"Only actively assigned sections\" />\n          <StatCard icon={BookOpen} label=\"My questions\" value={String(displayedQuestions)} sub=\"Questions authored by you\" />\n          <StatCard icon={FileText} label=\"My tests\" value={String(displayedPapers)} sub=\"Tests authored by you\" />\n          <StatCard icon={BarChart3} label=\"Students Needing Attention\" value=\"Review\" sub=\"Evidence-first queue below\" />\n        </div>\n      ) : (\n        <div className=\"grid gap-3 sm:grid-cols-2 sm:gap-4 lg:grid-cols-3 xl:grid-cols-6\" aria-label=\"School Admin focus metrics\">\n          <StatCard icon={Users} label=\"Students\" value={String(activeStudents)} sub=\"Active licensed students\" />\n          <StatCard icon={Users} label=\"Teachers\" value={schoolAdminMetrics.teachers == null ? '—' : String(schoolAdminMetrics.teachers)} sub=\"Active teacher accounts\" />\n          <StatCard icon={FileText} label=\"Tests\" value={String(displayedPapers)} sub=\"Institution tests\" />\n          <StatCard icon={BarChart3} label=\"Participation\" value={schoolAdminMetrics.participation == null ? '—' : `${schoolAdminMetrics.participation.toFixed(1)}%`} sub=\"Submitted-participant evidence\" />\n          <StatCard icon={BarChart3} label=\"Score\" value={schoolAdminMetrics.averageScore == null ? '—' : `${schoolAdminMetrics.averageScore.toFixed(1)}%`} sub=\"Weighted measured class score\" />\n          <StatCard icon={GraduationCap} label=\"Licence usage\" value={seatLimit > 0 ? `${activeStudents}/${seatLimit}` : '—'} sub={seatLimit > 0 ? `${Math.max(0, seatLimit - activeStudents)} licences available` : 'Licence quantity unavailable'} />\n        </div>\n      )}\n"""
          if old not in s: raise SystemExit('missing metric grid anchor')
          s = s.replace(old, new, 1)
          school.write_text(s)

          student = Path('src/components/evidara/student-dashboard.tsx')
          t = student.read_text()
          old = """  const trend = useMemo(() => [...(submittedResults ?? [])]\n"""
          new = """  const improvement = useMemo(() => {\n    if (!submittedResults || submittedResults.length < 2) return null;\n    return percentageValue(submittedResults[0].percentage) - percentageValue(submittedResults[1].percentage);\n  }, [submittedResults]);\n  const nextTest = startablePapers?.[0] ?? null;\n  const recentResult = submittedResults?.[0] ?? null;\n  const trend = useMemo(() => [...(submittedResults ?? [])]\n"""
          if old not in t: raise SystemExit('missing student derived anchor')
          t = t.replace(old, new, 1)

          anchor = """        <div className=\"flex flex-wrap gap-3\">\n          <Button onClick={() => setView('student-tests')} className=\"bg-[var(--amber)] font-semibold text-[var(--foreground)] hover:bg-[#e5a938]\"><Play className=\"mr-2 h-4 w-4\" />Take a Test</Button>\n          <Button variant=\"outline\" onClick={() => setView('student-results')} className=\"border-[var(--teal)]/30 text-[var(--teal)] hover:bg-[var(--secondary)]\">View Results</Button>\n          <Button variant=\"outline\" onClick={() => setView('student-resources')} className=\"border-[var(--line)] text-[var(--muted-foreground)] hover:bg-[var(--secondary)]\">Study Resources</Button>\n        </div>\n\n        <div className=\"grid min-w-0 gap-4 sm:gap-5 lg:gap-6 lg:grid-cols-5\">\n"""
          replacement = """        <div className=\"flex flex-wrap gap-3\">\n          <Button onClick={() => setView('student-tests')} className=\"bg-[var(--amber)] font-semibold text-[var(--foreground)] hover:bg-[#e5a938]\"><Play className=\"mr-2 h-4 w-4\" />Take a Test</Button>\n          <Button variant=\"outline\" onClick={() => setView('student-results')} className=\"border-[var(--teal)]/30 text-[var(--teal)] hover:bg-[var(--secondary)]\">View Results</Button>\n          <Button variant=\"outline\" onClick={() => setView('student-resources')} className=\"border-[var(--line)] text-[var(--muted-foreground)] hover:bg-[var(--secondary)]\">Study Resources</Button>\n        </div>\n\n        <div className=\"grid gap-4 sm:grid-cols-2 xl:grid-cols-4\" aria-label=\"Student focus dashboard\">\n          <Card className=\"rounded-xl border-[var(--line)] bg-white shadow-sm\"><CardHeader><CardTitle className=\"text-base\">Next Test</CardTitle></CardHeader><CardContent><p className=\"text-sm font-semibold text-[var(--foreground)]\">{nextTest?.title || 'No eligible test right now'}</p><p className=\"mt-1 text-xs text-[var(--muted-foreground)]\">{nextTest ? `${nextTest.duration_minutes} min · ${nextTest.total_questions} questions` : 'New assignments will appear here when released.'}</p></CardContent><CardFooter><Button variant=\"ghost\" className=\"text-[var(--teal)]\" onClick={() => setView('student-tests')}>Open tests<ArrowRight className=\"ml-1 h-4 w-4\" /></Button></CardFooter></Card>\n          <Card className=\"rounded-xl border-[var(--line)] bg-white shadow-sm\"><CardHeader><CardTitle className=\"text-base\">Recent Result</CardTitle></CardHeader><CardContent><p className=\"text-2xl font-bold text-[var(--foreground)]\">{recentResult ? `${percentageValue(recentResult.percentage).toFixed(1)}%` : '—'}</p><p className=\"mt-1 truncate text-xs text-[var(--muted-foreground)]\">{recentResult?.paper_title || 'No submitted result yet'}</p></CardContent><CardFooter><Button variant=\"ghost\" className=\"text-[var(--teal)]\" onClick={() => setView('student-results')}>Open results<ArrowRight className=\"ml-1 h-4 w-4\" /></Button></CardFooter></Card>\n          <Card className=\"rounded-xl border-[var(--line)] bg-white shadow-sm\"><CardHeader><CardTitle className=\"text-base\">Improvement</CardTitle></CardHeader><CardContent><p className=\"text-2xl font-bold text-[var(--foreground)]\">{improvement == null ? '—' : `${improvement >= 0 ? '+' : ''}${improvement.toFixed(1)} pp`}</p><p className=\"mt-1 text-xs text-[var(--muted-foreground)]\">{improvement == null ? 'Two submitted tests are required.' : 'Latest score versus the previous submitted test.'}</p></CardContent></Card>\n          <Card className=\"rounded-xl border-[var(--line)] bg-white shadow-sm\"><CardHeader><CardTitle className=\"text-base\">Focus Topics</CardTitle></CardHeader><CardContent><p className=\"text-sm text-[var(--muted-foreground)]\">Open your released evidence-based priorities; no topic is invented when assessment evidence is insufficient.</p></CardContent><CardFooter><Button variant=\"ghost\" className=\"text-[var(--teal)]\" onClick={() => setView('student-analytics-priorities')}>Open focus topics<ArrowRight className=\"ml-1 h-4 w-4\" /></Button></CardFooter></Card>\n        </div>\n\n        <div className=\"grid min-w-0 gap-4 sm:gap-5 lg:gap-6 lg:grid-cols-5\">\n"""
          if anchor not in t: raise SystemExit('missing student focus insertion anchor')
          t = t.replace(anchor, replacement, 1)
          student.write_text(t)

          smoke = Path('scripts/h3-h5-role-dashboard-smoke.mjs')
          smoke.write_text("""import fs from 'node:fs';\nimport path from 'node:path';\nconst root = process.cwd();\nconst read = (file) => fs.readFileSync(path.join(root, file), 'utf8');\nconst school = read('src/components/evidara/school-views.tsx');\nconst student = read('src/components/evidara/student-dashboard.tsx');\nconst failures = [];\nconst check = (name, ok) => { console.log(`${ok ? 'PASS' : 'FAIL'}  ${name}`); if (!ok) failures.push(name); };\nfor (const label of ['Students', 'Teachers', 'Tests', 'Participation', 'Score', 'Licence usage']) check(`H3 School Admin includes ${label}`, school.includes(`label=\\\"${label}\\\"`));\nfor (const label of ['Manage Students', 'Manage Teachers', 'Create Test', 'View Results']) check(`H3 School Admin action ${label}`, school.includes(`label: '${label}'`));\ncheck('H3 participation and score preserve unavailable state', school.includes("schoolAdminMetrics.participation == null ? '—'") && school.includes("schoolAdminMetrics.averageScore == null ? '—'"));\nfor (const label of ['Upload Questions', 'Create Test', 'Upcoming Tests', 'Recent Results']) check(`H4 Teacher action ${label}`, school.includes(`label: '${label}'`));\ncheck('H4 Students Needing Attention is first-class', school.includes('Students Needing Attention') && school.includes('<TeacherNeedsAttention'));\nfor (const label of ['Next Test', 'Recent Result', 'Improvement', 'Focus Topics']) check(`H5 Student focus includes ${label}`, student.includes(`>${label}<`));\ncheck('H5 Improvement uses two submitted results only', /submittedResults\.length < 2/.test(student) && /submittedResults\[0\]/.test(student) && /submittedResults\[1\]/.test(student));\ncheck('H5 Focus Topics routes to released analytics priorities', student.includes("setView('student-analytics-priorities')") && /no topic is invented/i.test(student));\nconsole.log(`\\n${19 - failures.length}/19 H3-H5 role-dashboard checks passed.`);\nif (failures.length) { console.error(`Failed: ${failures.join(', ')}`); process.exit(1); }\n""")
          PY
          node scripts/h3-h5-role-dashboard-smoke.mjs
      - name: Commit product and test changes
        run: |
          rm .github/workflows/h3-h5-dashboard-apply.yml
          git config user.name 'Evidara Phase 1 Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/evidara/school-views.tsx src/components/evidara/student-dashboard.tsx scripts/h3-h5-role-dashboard-smoke.mjs .github/workflows/h3-h5-dashboard-apply.yml
          git commit -m 'feat(h3-h5): focus role dashboards'
          git push origin HEAD:phase1-hardening

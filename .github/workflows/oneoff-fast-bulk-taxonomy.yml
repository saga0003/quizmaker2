name: One-off fast bulk taxonomy creation

on:
  push:
    branches:
      - fix/fast-bulk-taxonomy-2026-09-21
    paths:
      - .github/workflows/oneoff-fast-bulk-taxonomy.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/fast-bulk-taxonomy-2026-09-21
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply fast taxonomy fix
        run: python scripts/apply-fast-bulk-taxonomy-fix.py

      - name: Correct generated result typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/api/question-taxonomy/route.ts')
          s = p.read_text()
          s = s.replace('let createdChapterRows: Array<Record<string, unknown>> = [];', 'let createdChapterRows: typeof visibleChapters = [];')
          s = s.replace('let createdTopicRows: Array<Record<string, unknown>> = [];', 'let createdTopicRows: typeof visibleTopics = [];')
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -- --incremental false

      - name: Lint
        run: npm run lint

      - name: Import regression smoke
        run: npm run qa:v19-1

      - name: Production build
        run: npm run build

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "Evidara Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/oneoff-fast-bulk-taxonomy.yml scripts/apply-fast-bulk-taxonomy-fix.py
          git add src/app/api/question-taxonomy/route.ts src/components/evidara/question-bulk-import-dialog-core.tsx scripts/v19-1-latex-paper-import-smoke.mjs
          git commit -m "fix: create missing question taxonomy in one fast batch [fast-taxonomy]"
          git push origin HEAD:fix/fast-bulk-taxonomy-2026-09-21

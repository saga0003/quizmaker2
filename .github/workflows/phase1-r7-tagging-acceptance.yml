name: Phase 1 R7 Tagging Acceptance

on:
  push:
    branches: [phase1-hardening]
    paths:
      - .github/workflows/phase1-r7-tagging-acceptance.yml
      - .phase1-r7-trigger

permissions:
  contents: read

jobs:
  r7-tagging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDARA_LOAD_ACCEPTANCE: YES_I_UNDERSTAND_NON_PRODUCTION_ONLY
      EVIDARA_ACCEPTANCE_MODE: same-project-isolated-tenant
      EVIDARA_ACCEPTANCE_SUPABASE_REF: xzfozpnzvznqrvcsoail
      EVIDARA_ACCEPTANCE_ORG_SLUG: evidara-school-acceptance
      EVIDARA_ACCEPTANCE_URL: https://quizmaker2-f5sdk5vi7-saga0003s-projects.vercel.app
      EVIDARA_ACCEPTANCE_DB_BYTES: '216579235'
      EVIDARA_ACCEPTANCE_VERCEL_SHARE_URL: ${{ secrets.EVIDARA_ACCEPTANCE_VERCEL_SHARE_URL }}
      EVIDARA_ACCEPTANCE_SCHOOL_ADMIN_EMAIL: ${{ secrets.EVIDARA_ACCEPTANCE_SCHOOL_ADMIN_EMAIL }}
      EVIDARA_ACCEPTANCE_SCHOOL_ADMIN_PASSWORD: ${{ secrets.EVIDARA_ACCEPTANCE_SCHOOL_ADMIN_PASSWORD }}
      EVIDARA_ACCEPTANCE_EVIDENCE_DIR: acceptance-evidence/r7-tagging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run same-project safety preflight
        run: node scripts/phase1-acceptance-preflight.mjs --target "$EVIDARA_ACCEPTANCE_URL"
      - name: Install Playwright without changing lockfile
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Execute R7 rendered tagging acceptance
        run: node scripts/phase1-r7-tagging-acceptance.mjs
      - name: Upload redacted R7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-r7-tagging-${{ github.sha }}
          path: acceptance-evidence/r7-tagging
          if-no-files-found: warn
          retention-days: 14

name: F8 guarded hierarchy patch

on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/f8-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Repair duplicate section payload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/api/institution-analytics/route.ts')
          text = path.read_text()
          line = "    section: programmeId ? sectionRowFromEvidence(section, students, attempts, programmeId) : undefined,\n"
          duplicate = line + line
          if duplicate not in text:
              raise SystemExit('expected duplicate section payload was not found')
          path.write_text(text.replace(duplicate, line, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run F8 acceptance
        run: node scripts/f8-institution-drilldown-smoke.mjs
      - name: TypeScript verification
        run: npm run typecheck -- --incremental false
      - name: Commit guarded source repair
        run: |
          git config user.name "evidara-phase1-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/institution-analytics/route.ts
          git diff --cached --check
          git commit -m "fix(f8): remove duplicate section payload"
          git push origin HEAD:phase1-hardening

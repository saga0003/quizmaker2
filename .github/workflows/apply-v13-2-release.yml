name: Apply Evidara V13.2 release

on:
  push:
    branches:
      - release/evidara-v13-stable
    paths:
      - .release/v13.2/READY

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/evidara-v13-stable
          fetch-depth: 0
      - name: Reconstruct verified release archive
        shell: bash
        run: |
          set -euo pipefail
          cat .release/v13.2/part-* > /tmp/evidara-v13.2.tar.gz.b64
          base64 --decode /tmp/evidara-v13.2.tar.gz.b64 > /tmp/evidara-v13.2.tar.gz
          echo "1c17f266e366ca48fd14641b4c735044ba84a08e068020fcbc70c0d34b703074  /tmp/evidara-v13.2.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/evidara-v13.2.tar.gz -C .
      - name: Commit V13.2 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release/v13.2
          rm -f .github/workflows/apply-v13-2-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Evidara V13.2: analytics demo bridge and benchmark validation"
          git push origin HEAD:release/evidara-v13-stable

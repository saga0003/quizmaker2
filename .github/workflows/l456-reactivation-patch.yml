name: L456 Reactivation Patch
on:
  push:
    branches:
      - phase1-hardening
    paths:
      - .github/workflows/l456-reactivation-patch.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Patch suspended synthetic membership reactivation
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('scripts/phase1-l456-sharded-acceptance.mjs')
          s=p.read_text()
          old=base64.b64decode('').decode()
          new=base64.b64decode('').decode()
          if old not in s:
              raise SystemExit('guarded source block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name saga0003
          git config user.email sagar@smis.edu.in
          git add scripts/phase1-l456-sharded-acceptance.mjs
          git commit -m "fix(load): reactivate suspended L4-L6 synthetic memberships"
          git push origin HEAD:phase1-hardening

name: Record B3 Phase 1 progress

on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/b3-record-progress.yml']

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Record verified B3 evidence
        shell: python
        run: |
          from pathlib import Path
          checklist = Path('PHASE1_RELEASE_CHECKLIST.md')
          text = checklist.read_text()
          old = '- [ ] B3 First-class bulk student import with validation and failed-row export.'
          new = '- [x] B3 First-class bulk student import with validation and failed-row export — verified 31 Aug 2026. Access Control now provides a student-specific CSV import with explicit name/email/grade/academic-year mapping, full-row client validation and a hard 1,000-row limit with no silent truncation. The server independently validates every roster row, rejects duplicate emails, forces student semantics and institution scope, and removes a newly-created auth account if profile or membership provisioning fails. Results preserve original CSV row numbers; successful credentials and failed rows are exported separately, with failed rows retaining source values and the row error for correction/re-import. Dedicated 22-point `b3-bulk-student-import-smoke.mjs`, TypeScript, lint, all required regressions, production build and final gate enforcement passed clean candidate `ef1edb48dcebf8b55d6f00461319043fd2b51096` in release-gate run `33379329591` (2m 22s). Permanent production was not promoted.'
          if old not in text:
              raise SystemExit('B3 unchecked checklist line not found')
          checklist.write_text(text.replace(old, new, 1))

          log = Path('PHASE1_PROGRESS_LOG.md')
          entry = '''\n\n## 2026-08-31 14:57:29 IST — B3 Bulk student import (verified)\n\n- **Checklist item:** B3 — First-class bulk student import with validation and failed-row export.\n- **Run start:** 2026-08-31 14:57:29 IST.\n- **Repository/CI/deployment inspection:** B2 was verified first in this run. Production runtime errors for the preceding 24 hours were clean before product work, so no production incident remediation was required. Permanent production remained protected.\n- **Implementation start (first relevant commit):** 2026-08-31 15:09:06 IST — `88cf7dc8c71e3ea29ce61bab6f2c7f9ab9690f19` (`feat(b3): add validated student import UI`).\n- **Implementation end (final functional/rework commit):** 2026-08-31 15:14:56 IST — `442564ba8bc86f0ecd1889c6e753a8cc06b41871` (`fix(b3): import validation status badge`).\n- **Observable elapsed engineering span:** **5m 50s** from first B3 product commit to final functional rework commit. The one-time source-patch workflow was then removed, producing clean verification candidate `ef1edb48dcebf8b55d6f00461319043fd2b51096`.\n- **Verification:** GitHub Actions release-gate run `33379329591`, 2026-08-31 15:16:29–15:18:51 IST, duration **2m 22s — PASS**. The dedicated 22-point B3 regression, all prior P0/A/B1/B2 hardening checks, TypeScript, lint, every required regression suite, production build and final release-gate enforcement passed.\n- **Implementation result:** The generic bulk-account importer is now a first-class student roster workflow. CSV files require explicit student name/email/grade/academic-year mapping, validate all rows before import, reject files over 1,000 rows instead of silently truncating, preserve source row numbers, and offer separate credentials and failed-row CSV exports. Server-side `bulkImportStudents` independently revalidates required fields, grade/year/email format and duplicate emails, enforces student role and institution boundaries, and deletes newly-created auth accounts when downstream profile or membership setup fails.\n- **Rework/failures:** An initial one-time source-patch workflow was syntactically invalid (`33378740720`). The next helper run (`33378878192`) produced the intended patch but GitHub correctly refused its attempt to modify another workflow file without workflow-write permission; source and release-gate changes were subsequently separated. First full B3 candidate run `33379056875` passed the B3 checks 22/22 but failed TypeScript because the new validation summary referenced `Badge` without importing it. That UI import was added in `442564ba8bc86f0ecd1889c6e753a8cc06b41871`; the clean candidate then passed the full gate. Superseded workflow attempts were not used as verification evidence.\n- **Deployment/health:** Permanent production was not promoted or altered. Vercel's automatic preview for the first B3 UI commit returned ERROR and newer automatic B3 previews were not available in the deployment list during final verification, so no preview readiness claim is made; the exact clean candidate independently passed the repository production build in the complete release gate.\n- **Next action:** B4 — enforce the student lifecycle as Active / Withdrawn / Completed / Suspended and prevent destructive deletion once assessment attempts exist.\n'''
          current = log.read_text()
          if '## 2026-08-31 14:57:29 IST — B3 Bulk student import (verified)' not in current:
              log.write_text(current.rstrip() + entry + '\n')
      - name: Commit progress evidence
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          git commit -m "docs(b3): record verified student import" || exit 0
          git push origin phase1-hardening

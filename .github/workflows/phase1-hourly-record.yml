name: Phase1 hourly record
on:
  push:
    branches:
      - phase1-hardening
permissions:
  contents: write
jobs:
  record:
    if: contains(github.event.head_commit.message, '[record-hourly]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
          fetch-depth: 0
      - name: Record checkpoint
        shell: bash
        run: |
          python3 scripts/record-phase1-hourly.py
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          git commit -m "docs(phase1): record D3-D5 verification and D6 heartbeat"
          git push origin HEAD:phase1-hardening

name: H8 Mobile Analytics Contract

on:
  push:
    branches: [phase1-hardening, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  mobile-analytics-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: H8 mobile analytics regression
        run: node scripts/h8-mobile-analytics-smoke.mjs

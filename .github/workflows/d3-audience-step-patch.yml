name: D3 Audience Step Patch

on:
  push:
    branches:
      - phase1-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore d3 execute audience patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Apply guarded D3 patch
        run: python scripts/d3_audience_patch.py
      - name: Commit product patch
        run: |
          git config user.name "Evidara Phase 1 Hardening"
          git config user.email "sagar@smis.edu.in"
          git add src/components/evidara/paper-assignment-center.tsx src/components/evidara/live-paper-catalogue-v8.tsx scripts/d3-paper-builder-wizard-smoke.mjs PHASE1_RELEASE_CHECKLIST.md
          git commit -m "feat(d3): integrate audience into five-step builder"
          git push origin HEAD:phase1-hardening

name: One-off question bundle hardening

on:
  push:
    branches:
      - phase1-launch-hardening-2026-09-11
    paths:
      - .github/workflows/oneoff-question-bundle-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[zip-import-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-launch-hardening-2026-09-11
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply question bundle patch
        run: python .github/scripts/oneoff_question_bundle_hardening.py

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -- --incremental false

      - name: Lint
        run: npm run lint

      - name: Import regression smoke
        run: npm run qa:v19-1

      - name: Production build
        run: npm run build

      - name: Commit verified patch
        shell: bash
        run: |
          git config user.name "Evidara Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/oneoff-question-bundle-hardening.yml .github/scripts/oneoff_question_bundle_hardening.py
          git add src/components/evidara/question-bulk-import-dialog-core.tsx src/components/evidara/live-paper-catalogue-v8.tsx src/components/evidara/ai-import-helper.tsx src/lib/questionDocumentReader.ts src/lib/questionTemplateWorkbook.ts
          git commit -m "feat: live ZIP question bundles and paper imports [zip-import-patch]"
          git push origin HEAD:phase1-launch-hardening-2026-09-11

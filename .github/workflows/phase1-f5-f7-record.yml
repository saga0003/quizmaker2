name: Record F5-F7 verification
on:
  push:
    branches: [phase1-hardening]
    paths: ['.github/workflows/phase1-f5-f7-record.yml']
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hardening
      - name: Record verified analytics items
        shell: python
        run: |
          from pathlib import Path
          checklist = Path('PHASE1_RELEASE_CHECKLIST.md')
          s = checklist.read_text()
          replacements = {
            '- [ ] F5 Standard analytics row/card contains exposure, attempted, correct, incorrect, unanswered, accuracy, score %, time, trend and evidence count.': '- [x] **F5 Standard analytics evidence row** — verified 1 Sep 2026. Shared taxonomy rows expose Exposure, canonical Attempted = correct + incorrect, Correct, Incorrect, Unanswered, Accuracy, weighted Score %, Time, Trend and response Evidence count; missing denominators fail closed. Permanent `f5-standard-analytics-row-smoke.mjs` is enforced in the complete release gate. Descendant candidate `f89629c31e632e6518f7ec11630f053ca5b0943e` passed release gate `33505090942`.',
            '- [ ] F6 Topic weakness/strength requires minimum evidence threshold; display sample size.': '- [x] **F6 Topic evidence threshold** — verified 1 Sep 2026. Weak/strong interpretation and revision priorities require at least 5 answered questions (correct + incorrect) in the topic; insufficient evidence renders as Building evidence/— and the sample size remains visible. Permanent F6 regressions are enforced in the complete gate; candidate `f89629c31e632e6518f7ec11630f053ca5b0943e` passed release gate `33505090942`.',
            '- [ ] F7 Percentile labelled by actual cohort; minimum cohort threshold for prominent comparisons.': '- [x] **F7 Percentile cohort semantics** — verified 1 Sep 2026. Percentile is explicitly labelled as same-assessment submitters, uses submitted attempts only, requires a minimum cohort of 5 for prominent comparison, and explains unavailable states rather than implying class/school percentile. Permanent F7 regressions are enforced in the complete gate; candidate `f89629c31e632e6518f7ec11630f053ca5b0943e` passed release gate `33505090942`.'
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing checklist anchor: {old[:25]}')
            s = s.replace(old,new,1)
          checklist.write_text(s)
          log = Path('PHASE1_PROGRESS_LOG.md')
          with log.open('a') as f:
            f.write('''\n\n## 2026-09-01 17:29:57 IST — F5/F6/F7 analytics verification / hourly heartbeat\n- **Run start/end:** 2026-09-01 17:29:57 IST → approximately 17:42 IST.\n- **Active engineering/review span:** approximately **12 minutes** of observable reconciliation, CI/deployment/database verification and release recording in the available execution window. The requested 45–50 minute target was **not met because this runtime window ended materially earlier**; no idle padding was added.\n- **Section worked:** F — Results and analytics.\n- **Checklist items completed:** F5, F6 and F7.\n- **Items still pending:** F8–F13.\n- **Starting/functional branch head:** `f89629c31e632e6518f7ec11630f053ca5b0943e`.\n- **Commits created:** existing product/gate commits through `f89629c31e632e6518f7ec11630f053ca5b0943e`, plus this recorder commit.\n- **CI:** complete Phase-1 release gate `33505090942` on exact candidate `f89629c31e632e6518f7ec11630f053ca5b0943e` — **PASS**, 2026-09-01 17:27:12–17:29:23 IST (~2m11s). Gate includes F5 standardized analytics row, F6 topic evidence threshold, F7 percentile cohort checks, TypeScript, lint, all prior regressions and production build.\n- **Vercel:** production runtime inspection found **no error/fatal logs in the preceding 24 hours**. Preview creation for current rapid pushes remains Hobby build-rate limited; no production promotion occurred.\n- **Supabase:** project `xzfozpnzvznqrvcsoail` (`SMIS QP`) is **ACTIVE_HEALTHY** on Postgres 17.6.1. No database mutation was required for F5–F7 in this run.\n- **Rework/failures/blockers:** container-side direct GitHub clone could not resolve github.com, so source reconciliation used the connected GitHub API; this did not affect repository or production. No functional blocker remains for F5–F7.\n- **Section F progress:** 7/13 verified = **53.8%**.\n- **Overall Phase 1:** 65/129 verified = **50.4%**.\n- **Exact next action:** F8 — verify/implement School → programme → grade → section → subject → chapter → topic → student institutional drilldown, add a permanent F8 regression, and require a complete release-gate PASS before checking F8; continue immediately to F9 if green.\n''')
      - name: Commit record
        run: |
          git config user.name "Evidara Hardening Bot"
          git config user.email "sagar@smis.edu.in"
          git add PHASE1_RELEASE_CHECKLIST.md PHASE1_PROGRESS_LOG.md
          git commit -m "docs(f5-f7): record verified analytics thresholds"
          git push origin HEAD:phase1-hardening